<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>TaskEarnPro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html,body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
  body{-webkit-user-select:none;user-select:none;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  input,textarea,select,.selectable{-webkit-user-select:text;user-select:text}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}

  body{background:#eef1ff;background-image:radial-gradient(55% 38% at 12% 0%,rgba(99,102,241,.40),transparent 62%),radial-gradient(45% 36% at 100% 12%,rgba(168,85,247,.30),transparent 62%),radial-gradient(60% 45% at 0% 100%,rgba(56,189,248,.30),transparent 62%),radial-gradient(45% 35% at 100% 100%,rgba(244,114,182,.18),transparent 62%);background-attachment:fixed}
  .glass{background:linear-gradient(135deg,rgba(255,255,255,.74),rgba(255,255,255,.46));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(49,46,129,.10),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35)}
  .glass-strong{background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.64));-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid rgba(255,255,255,.85);box-shadow:0 14px 40px rgba(49,46,129,.16),inset 0 1px 0 #fff}
  .glass-bar{background:rgba(255,255,255,.60);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.75);box-shadow:0 4px 24px rgba(49,46,129,.06)}
  .glass-chip{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(49,46,129,.05)}
  .glass-input{background:rgba(255,255,255,.55)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9)!important;box-shadow:inset 0 1px 3px rgba(49,46,129,.10)}
  .glass-input:focus{background:rgba(255,255,255,.9)!important;border-color:#6366f1!important}
  .hero{position:relative;background:linear-gradient(135deg,rgba(79,70,229,.95),rgba(139,92,246,.88));border:1px solid rgba(255,255,255,.35);box-shadow:0 18px 40px rgba(79,70,229,.35),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12)}
  .hero::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.30),transparent 42%);pointer-events:none}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#7c3aed);border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 20px rgba(99,102,241,.35),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,filter .15s}
  .btn-primary:active{transform:scale(.98);filter:brightness(.95)}
  
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  @supports not (backdrop-filter:blur(1px)){.glass,.glass-strong,.glass-bar,.glass-chip{background:rgba(255,255,255,.94)}}

  .splash-pop{animation:spop .9s cubic-bezier(.2,.9,.3,1.15) both}@keyframes spop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  .splash-glow{animation:sglow 2.2s ease-in-out infinite}@keyframes sglow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.18)}}
  .splash-bar{width:0;animation:sload 1.8s ease forwards}@keyframes sload{to{width:100%}}

  :root{--env-t:env(safe-area-inset-top,0px);--env-b:env(safe-area-inset-bottom,0px);--wv-t:0px;--wv-b:0px;--sat:max(var(--env-t),var(--wv-t));--sab:max(var(--env-b),var(--wv-b))}
  html.wv{--wv-t:34px;--wv-b:14px}
  html{scroll-behavior:smooth}
  .app-header{padding-top:var(--sat);min-height:calc(56px + var(--sat))}
  .side-top{padding-top:calc(16px + var(--sat))}
  .bottom-nav{bottom:calc(12px + var(--sab))}
  .auth-wrap{padding-top:calc(40px + var(--sat))}
  .hero{overflow:hidden}
  .hero::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 5.5s ease-in-out infinite;pointer-events:none}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  #view.enter>*{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
  #view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}#view.enter>*:nth-child(4){animation-delay:.15s}#view.enter>*:nth-child(n+5){animation-delay:.2s}
  .enter .stagger>*{animation:rise .6s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*80ms + 150ms)}
  #flashBox>div{animation:pop .45s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
  .modal-pop{animation:sheet .45s cubic-bezier(.22,1,.36,1) both}@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .rip{position:relative;overflow:hidden}
  .ripple{position:absolute;border-radius:9999px;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .65s ease-out;pointer-events:none}
  @keyframes ripple{to{transform:scale(4);opacity:0}}
  .skel{background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.9),rgba(255,255,255,.4));background-size:200% 100%;animation:skel 1.3s linear infinite}
  @keyframes skel{to{background-position:-200% 0}}
  .tab .pill{transition:background-color .35s,transform .35s cubic-bezier(.22,1,.36,1)}
  .tab.text-indigo-600 .pill{transform:translateY(-2px) scale(1.07)}
  button,.glass-chip{transition:transform .18s cubic-bezier(.22,1,.36,1)}
  button:active,.glass-chip:active{transform:scale(.97)}
  #wvHost iframe{width:100%;height:100%}
  .btn-start{position:relative;overflow:hidden;color:#fff;background:linear-gradient(110deg,#6366f1,#8b5cf6,#d946ef,#6366f1);background-size:250% 100%;border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 24px rgba(99,102,241,.4),inset 0 1px 0 rgba(255,255,255,.5);animation:startflow 3.5s linear infinite,startpulse 2s ease-in-out infinite}
  .btn-start::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.4s ease-in-out infinite;pointer-events:none}
  .btn-start i{animation:nudge 1.2s ease-in-out infinite}
  @keyframes startflow{to{background-position:250% 0}}
  @keyframes startpulse{0%,100%{box-shadow:0 10px 24px rgba(99,102,241,.4),0 0 0 0 rgba(139,92,246,.5)}50%{box-shadow:0 10px 24px rgba(99,102,241,.4),0 0 0 10px rgba(139,92,246,0)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  @keyframes shine{0%{left:-70%}60%,100%{left:130%}}
</style>
</head>

function compress(file, max, q, crop169) {
  return new Promise((res, rej) => {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return rej(new Error('Only JPG, PNG or WEBP images are allowed.'));
    if (file.size > 8 * 1024 * 1024) return rej(new Error('Image is too large. Maximum size is 8 MB.'));
    const r = new FileReader();
    r.onerror = () => rej(new Error('Could not read the image.'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('The file is not a valid image.'));
      img.onload = () => {
        const c = document.createElement('canvas'), x = c.getContext('2d');
        if (crop169) { c.width = 640; c.height = 360; const k = Math.max(640 / img.width, 360 / img.height), w = img.width * k, h = img.height * k; x.drawImage(img, (640 - w) / 2, (360 - h) / 2, w, h); }
        else { const k = Math.min(1, max / Math.max(img.width, img.height)); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); x.drawImage(img, 0, 0, c.width, c.height); }
        res(c.toDataURL('image/jpeg', q));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

// Every balance change is followed by a transaction record.
async function credit(uid, amt, reason, lb) {
  await runTransaction(ref(db, `users/${uid}/balance`), c => (c || 0) + amt);
  await set(push(ref(db, `transactions/${uid}`)), { type: 'credit', amount: amt, reason, ts: serverTimestamp() });
  if (lb) { try { await runTransaction(ref(db, `leaderboard/${uid}/earned`), c => (c || 0) + amt); await set(ref(db, `leaderboard/${uid}/name`), S.profile.name); } catch (_) { /* leaderboard is optional */ } }
}
const activeTasks = () => Object.entries(S.tasks).map(([id, t]) => ({ ...t, id })).filter(t => t.status === 'active').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const taskReward = t => t.type === 'daily' ? cfg('daily_checkin_reward') : (t.reward || 0);
const needsProof = t => t.type !== 'daily' && !!t.proofRequired && !isAutoWatch(t);
function taskState(t) {
  const rec = S.ut[t.id];
  if (t.type === 'daily') return rec && rec.date === todayStr() && rec.status === 'approved' ? 'done' : 'available';
  if (rec && rec.status === 'approved') return 'done';
  if (rec && rec.status === 'pending') return 'pending';
  const max = t.maxCompletions || 0;
  if (max > 0 && (S.stats[t.id] || 0) >= max) return 'limit';
  return 'available';
}
const stateMsg = (s, t) => s === 'done' ? (t.type === 'daily' ? 'Already claimed. Come back tomorrow.' : 'Task already completed.') : s === 'pending' ? 'You already have a submission waiting for review.' : 'This task has reached its completion limit.';

async function completeTask(id, file, verified) {
  const t = S.tasks[id] && { ...S.tasks[id], id };
  if (!t || t.status !== 'active') return flash('error', 'Task not found or no longer available.');
  const st = taskState(t);
  if (st !== 'available') return flash('error', stateMsg(st, t));
  if (isAutoWatch(t) && !verified) return flash('error', 'Watch the video to complete this task.');
  const uid = S.user.uid;
  const rec = { title: t.title, type: t.type, reward: taskReward(t), ts: serverTimestamp(), date: todayStr() };
  try {
    if (needsProof(t)) {
      if (!file) return flash('error', 'Please choose a proof image.');
      const img = await compress(file, 900, 0.72);
      await set(ref(db, `proofs/${uid}/${id}`), img);
      await set(ref(db, `userTasks/${uid}/${id}`), { ...rec, status: 'pending' });           // one record per user+task = no duplicates
      await runTransaction(ref(db, `taskStats/${id}`), c => (c || 0) + 1);
      flash('success', 'Proof submitted. Waiting for admin review.');
    } else {
      await set(ref(db, `userTasks/${uid}/${id}`), { ...rec, status: 'approved' });          // rules reject a second claim
      if (rec.reward > 0) await credit(uid, rec.reward, t.type === 'daily' ? 'Daily check-in reward' : 'Task completed: ' + t.title, true);
      if (t.type !== 'daily') await runTransaction(ref(db, `taskStats/${id}`), c => (c || 0) + 1);
      flash('success', t.type === 'daily' ? 'Daily reward claimed. Come back tomorrow.' : 'Task completed. Reward added to your wallet.');
    }
    onTaskDone();
  } catch (e) { flash('error', isPerm(e) ? 'Task already completed or not available.' : (e.message || 'Something went wrong.')); }
}

async function doWithdraw(upi, amtStr) {
  const mk = S.method, m = METHODS[mk], amt = parseMoney(amtStr), uid = S.user.uid, min = cfg(m.min), max = cfg(m.max);
  if (mk === 'upi' && !/^[a-zA-Z0-9._-]{2,64}@[a-zA-Z]{2,32}$/.test(upi)) return flash('error', 'Invalid UPI ID.');
  if (!amt || amt <= 0) return flash('error', 'Enter a valid amount.');
  if (amt < min) return flash('error', 'Minimum for ' + m.label + ' is ' + money(min) + '.');
  if (amt > max) return flash('error', 'Maximum for ' + m.label + ' is ' + money(max) + '.');
  if ((S.profile.balance || 0) < amt) return flash('error', 'Insufficient wallet balance.');
  try {
    // 1) debit atomically (aborts if balance is too low)
    const r = await runTransaction(ref(db, `users/${uid}/balance`), c => (typeof c === 'number' && c >= amt) ? c - amt : (c === null ? 0 : undefined));
    if (!r.committed) return flash('error', 'Insufficient wallet balance.');
    // 2) create the request + transaction record. If this fails we refund.
    const wref = push(ref(db, `withdrawals/${uid}`));
    try {
      const rec = { uid, name: S.profile.name, mobile: S.profile.mobile, method: mk, amount: amt, status: 'pending', createdAt: serverTimestamp() };
      if (mk === 'upi') rec.upi = upi;
      await set(wref, rec);
      await set(push(ref(db, `transactions/${uid}`)), { type: 'debit', amount: amt, reason: 'Redeem request (' + m.label + ')', ref: wref.key, ts: serverTimestamp() });
      flash('success', 'Redeem request submitted.');
    } catch (e2) { await runTransaction(ref(db, `users/${uid}/balance`), c => (c || 0) + amt); flash('error', 'Could not submit the request. Please try again.'); }
  } catch (e) { flash('error', 'Something went wrong. Please try again.'); }
}

// Promote your own app / channel: the advertiser pays from the wallet, admin approves, and it becomes a task for everyone.
async function doPromote(f) {
  const name = f.pname.value.trim(), url = f.purl.value.trim(), type = f.ptype.value, qty = parseInt(f.pqty.value, 10), note = f.pnote.value.trim(), uid = S.user.uid;
  if (name.length < 2 || name.length > 60) return flash('error', 'Enter the app or channel name (2-60 characters).');
  if (!/^https?:\/\/\S+$/i.test(url) || url.length > 300) return flash('error', 'Enter a valid link starting with http:// or https://');
  if (!['install', 'review', 'channel', 'watch'].includes(type)) return flash('error', 'Choose a task type.');
  if (!(qty >= 10 && qty <= 1000)) return flash('error', 'Quantity must be between 10 and 1000.');
  const price = cfg('promo_price'), cost = qty * price;
  if ((S.profile.balance || 0) < cost) return flash('error', 'Insufficient wallet balance. You need ' + money(cost) + '.');
  const r = await runTransaction(ref(db, `users/${uid}/balance`), c => (typeof c === 'number' && c >= cost) ? c - cost : (c === null ? 0 : undefined));
  if (!r.committed) return flash('error', 'Insufficient wallet balance.');
  const pref = push(ref(db, `promos/${uid}`));
  try {
    await set(pref, { name, url, type, qty, cost, rewardPer: cfg('promo_reward'), note: note.slice(0, 200), status: 'pending', createdAt: serverTimestamp() });
    await set(push(ref(db, `transactions/${uid}`)), { type: 'debit', amount: cost, reason: 'Promotion: ' + name, ref: pref.key, ts: serverTimestamp() });
    f.reset(); flash('success', 'Promotion submitted. It goes live after admin approval.');
  } catch (e) { await runTransaction(ref(db, `users/${uid}/balance`), c => (c || 0) + cost); flash('error', 'Could not submit the promotion. Please try again.'); }
}

const authMsg = e => { const c = (e && e.code) || ''; return c.includes('email-already-in-use') ? 'This mobile number is already registered. Please login.' : /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? 'Invalid mobile number or password.' : c.includes('too-many-requests') ? 'Too many attempts. Please try again later.' : c.includes('network') ? 'Network error. Check your connection.' : c.includes('operation-not-allowed') ? 'Enable Email/Password sign-in in Firebase Authentication.' : 'Something went wrong. Please try again.'; };
const genCode = () => { const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; const a = crypto.getRandomValues(new Uint8Array(8)); a.forEach(n => s += ch[n % ch.length]); return s; };

async function doLogin(f) {
  const mobile = f.mobile.value.replace(/\D/g, ''), pass = f.password.value;
  S.authErr = '';
  try { await signInWithEmailAndPassword(auth, `${mobile}@${DOMAIN}`, pass); } catch (e) { S.authErr = authMsg(e); renderAuth(true); }
}
async function doSignup(f) {
  const name = f.name.value.trim(), mobile = f.mobile.value.replace(/\D/g, ''), pass = f.password.value, pass2 = f.confirm.value, rc = f.refcode.value.trim().toUpperCase();
  S.refPrefill = rc;
  const bad = name.length < 2 || name.length > 60 ? 'Please enter your full name (2-60 characters).' : !/^[0-9]{10}$/.test(mobile) ? 'Enter a valid 10-digit mobile number.' : pass.length < 6 ? 'Password must be at least 6 characters.' : pass !== pass2 ? 'Passwords do not match.' : '';
  if (bad) { S.authErr = bad; return renderAuth(true); }
  let referrer = null;
  try {
    if (rc) { const s = await get(ref(db, 'referralCodes/' + rc)); if (!s.exists()) { S.authErr = 'Invalid referral code.'; return renderAuth(true); } referrer = s.val(); }
    S.signingUp = true; S.authErr = '';
    const cred = await createUserWithEmailAndPassword(auth, `${mobile}@${DOMAIN}`, pass);
    const uid = cred.user.uid;
    let code = null;
    for (let i = 0; i < 6 && !code; i++) { const c = genCode(); try { await set(ref(db, 'referralCodes/' + c), uid); code = c; } catch (e) { /* code taken, try another */ } }
    if (!code) throw new Error('code');
    await set(ref(db, 'users/' + uid), { name, mobile, referralCode: code, referredBy: referrer, status: 'active', balance: 0, createdAt: serverTimestamp() });
    if (referrer) await set(ref(db, `referrals/${referrer}/${uid}`), { name, createdAt: serverTimestamp(), rewarded: false });
    const bonus = cfg('welcome_bonus'); if (bonus > 0) await credit(uid, bonus, 'Welcome bonus');
    try { await set(ref(db, `leaderboard/${uid}/name`), name); await set(ref(db, `leaderboard/${uid}/earned`), 0); } catch (_) { /* leaderboard row is optional */ }
    const fb = cfg('referee_bonus'); if (referrer && fb > 0) await credit(uid, fb, 'Referral bonus');
    S.signingUp = false; await boot(cred.user);
  } catch (e) { S.signingUp = false; S.authErr = authMsg(e); renderAuth(true); }
}

const route = () => { const h = (location.hash || '#/home').replace(/^#\//, '').split('/'); return [views[h[0]] ? h[0] : 'home', h[1]]; };
function render(force) {
  if (!S.user || !S.profile || !$('#view')) return;
  const a = document.activeElement;
  if (!force && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#view').contains(a)) return;
  const [v, arg] = route(), key = v + '/' + (arg || '');
  if (!force && S.watch && v === 'task' && S.watch.taskId === arg) { updateWatchUI(); return; }   // never rebuild the video player while it is playing

  const tab = { home: 'home', task: 'home', wallet: 'wallet', withdraw: 'wallet', addmoney: 'wallet', partners: 'home', leaderboard: 'rank', promote: 'profile', terms: 'profile', privacy: 'profile', contact: 'profile', refer: 'refer', profile: 'profile' }[v];
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.tab === tab; t.classList.toggle('text-indigo-600', on); t.classList.toggle('text-slate-400', !on); t.querySelector('.pill').classList.toggle('bg-indigo-50', on); });
  document.querySelectorAll('.side-link').forEach(l => { const on = l.getAttribute('href') === '#/' + ({ task: 'home', withdraw: 'wallet' }[v] || v); l.classList.toggle('bg-indigo-50', on); l.classList.toggle('text-indigo-600', on); });
  document.querySelectorAll('.js-site').forEach(e => e.textContent = cfg('site_name'));
  $('#sbName').textContent = S.profile.name; $('#sbMobile').textContent = S.profile.mobile;
  const enter = key !== lastRoute; if (enter) { window.scrollTo(0, 0); lastRoute = key; }
  afterRender(v, arg, enter);
}
window.addEventListener('hashchange', () => { S.flash = null; closeModal(); render(true); });

S.errs = {}; S._loaded = {}; S.watchSecs = {}; S.watch = null; S.pay = null; S.ads = {}; S.advToday = 0; S.dep = {}; S._done = 0; S._qr = {};
const ENC = encodeURIComponent;
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return S['_ls_' + k] || null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) { S['_ls_' + k] = v; } };
function fmtT(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const copyTxt = t => new Promise(res => { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(res, res); } else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); res(); } });
const openExt = u => { const w = window.open(u, '_blank', 'noopener'); if (!w) location.href = u; };

// ---- APK / WebView: when the app draws under the status bar, push the header and nav inside the safe area
function detectWV() { const edge = /Android/i.test(navigator.userAgent) && (screen.height - window.innerHeight) < 20 && !document.fullscreenElement; document.documentElement.classList.toggle('wv', edge || /[?&]safe=1/.test(location.search)); }

function animateNum(el, from, to) {

  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = money(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };

// ---- leaderboard: every user gets a row; own total is synced from the wallet history
const lbSkip = r => /refund|welcome bonus|referral bonus|wallet top-up/i.test(r || '');
async function syncLb() {
  S._lbSynced = true; const uid = S.user.uid;
  try {
    const mine = (await get(ref(db, `leaderboard/${uid}`))).val();
    const total = Object.values(S.tx).filter(t => t.type === 'credit' && !lbSkip(t.reason)).reduce((s, t) => s + (t.amount || 0), 0);
    if (!mine || mine.name !== S.profile.name) await set(ref(db, `leaderboard/${uid}/name`), S.profile.name);
    let diff = total - ((mine && mine.earned) || 0), guard = 0;
    if (!mine && diff <= 0) await set(ref(db, `leaderboard/${uid}/earned`), 0);
    while (diff > 0 && guard++ < 80) { const step = Math.min(diff, 50000); await runTransaction(ref(db, `leaderboard/${uid}/earned`), c => (c || 0) + step); diff -= step; }
  } catch (e) { console.error('leaderboard sync', e.message); }
}
function maybeSyncLb() { if (!S._lbSynced && S._loaded.tx && S._loaded.lb && S.user && S.profile) syncLb(); }

// ---- Watch & Earn: automatic verification (video must really play for the minimum time)
function ytId(u) { const m = String(u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m ? m[1] : null; }

function isAutoWatch(t) { return t.type === 'watch' && (t.watchSeconds || 0) > 0 && !!videoKind(t.url); }
const watchOK = () => lsGet('te_watch_ok') === '1';
const watchSteps = t => ['Allow the permission when asked.', 'Press play on the video below.', 'Keep watching for at least ' + fmtT(t.watchSeconds) + '. The timer pauses if you stop the video, leave this screen or speed it up.', 'Your reward is added automatically.'];
function watchBlock(t) {
  if (!watchOK()) return `<div class="${CARD} p-4"><p class="mb-1 text-sm font-bold"><i class="fa-solid fa-shield-halved mr-1.5 text-indigo-600"></i>Permission needed</p>
    <p class="text-sm text-slate-600">To verify your watch time automatically, ${esc(cfg('site_name'))} needs your permission to monitor video playback on this screen and keep the screen awake while you watch. No camera, microphone, contacts or files are accessed.</p>
    <div class="mt-4 grid grid-cols-2 gap-3"><button data-act="consent" class="${BTN}">Allow</button><button data-act="denyconsent" class="rounded-xl bg-slate-100 py-3.5 text-sm font-semibold text-slate-600">Not now</button></div>${S.consentDenied ? '<p class="mt-3 text-xs text-red-600">Permission is required to earn from this task.</p>' : ''}</div>`;
  const s = S.watchSecs[t.id] || 0;
  return `<div class="${CARD} p-4"><div class="aspect-video overflow-hidden rounded-xl bg-black"><div id="wvHost" class="h-full w-full"></div></div>
    <div class="mt-3"><div class="mb-1.5 flex justify-between text-xs font-semibold text-slate-500"><span id="wvTime">${fmtT(s)} / ${fmtT(t.watchSeconds)}</span><span id="wvStatus">Press play</span></div>
    <div class="h-2.5 overflow-hidden rounded-full bg-slate-200"><div id="wvBar" class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all duration-700" style="width:${Math.min(100, s / t.watchSeconds * 100)}%"></div></div></div></div>`;
}
let ytReady = null;
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => { const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); }; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { ytReady = null; rej(new Error('yt')); }; document.head.appendChild(s); setTimeout(() => rej(new Error('yt timeout')), 12000); });
  return ytReady;
}
function updateWatchUI() {
  const w = S.watch; if (!w) return; const s = S.watchSecs[w.taskId] || 0, st = w.state || {};
  const T = $('#wvTime'), B = $('#wvBar'), X = $('#wvStatus'); if (!T) return;
  T.textContent = fmtT(s) + ' / ' + fmtT(w.need); B.style.width = Math.min(100, s / w.need * 100) + '%';
  X.textContent = document.hidden ? 'Keep this screen open' : st.rate > 1 ? 'Set speed to normal' : st.playing ? 'Watching...' : 'Press play';
}
function tick() {
  const w = S.watch; if (!w) return; let playing = false, rate = 1;
  if (w.player && w.player.getPlayerState) { try { playing = w.player.getPlayerState() === 1; rate = w.player.getPlaybackRate ? w.player.getPlaybackRate() : 1; } catch (_) {} }
  else if (w.video) { playing = !w.video.paused && !w.video.ended; rate = w.video.playbackRate; }
  w.state = { playing, rate };
  if (playing && !document.hidden && rate <= 1) S.watchSecs[w.taskId] = (S.watchSecs[w.taskId] || 0) + 1;
  updateWatchUI();
  if ((S.watchSecs[w.taskId] || 0) >= w.need && !w.done) { w.done = true; finishWatch(); }
}
function stopWatch() { const w = S.watch; if (!w) return; clearInterval(w.timer); try { if (w.player && w.player.destroy) w.player.destroy(); } catch (_) {} try { if (w.lock) w.lock.release(); } catch (_) {} S.watch = null; }
async function startWatch(id) {
  const t = S.tasks[id], host = $('#wvHost'); if (!t || !host) return;

  const w = S.watch = { taskId: id, need: t.watchSeconds, timer: null, state: {} };
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { w.lock = l; }).catch(() => {}); } catch (_) {}
  if (videoKind(t.url) === 'yt') {
    try { await loadYT(); } catch (_) { const X = $('#wvStatus'); if (X) X.textContent = 'Video could not load'; return; }

    $('#wvHost').innerHTML = '<div id="ytp"></div>';

  } else { host.innerHTML = `<video src="${esc(t.url)}" controls playsinline class="h-full w-full"></video>`; w.video = host.firstChild; }
  w.timer = setInterval(tick, 1000); updateWatchUI();
}
async function finishWatch() { const w = S.watch; if (!w) return; const id = w.taskId; stopWatch(); delete S.watchSecs[id]; await busy(() => completeTask(id, null, true)); }

    <div class="hero mb-4 rounded-3xl p-5 text-center text-white"><p class="relative text-xs font-medium text-indigo-100">Your Referral Code</p><p class="selectable relative mt-2 text-3xl font-extrabold tracking-widest">${esc(code)}</p>
      <button data-act="copy" data-v="${esc(code)}" class="rip relative mt-4 inline-flex items-center gap-2 rounded-xl bg-white px-5 py-2.5 text-sm font-semibold text-indigo-600"><i class="fa-solid fa-copy"></i>Copy Code</button></div>
    <div class="mb-4 ${CARD} p-4"><p class="mb-2 text-xs font-semibold text-slate-600"><i class="fa-solid fa-link mr-1"></i>Referral Link</p>
      <input readonly value="${esc(link)}" class="selectable w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-xs text-slate-600 outline-none">
      <div class="mt-2 flex items-center justify-between rounded-xl bg-indigo-50 px-3 py-2.5"><span class="text-xs font-semibold text-indigo-700">Referral Code</span><span class="selectable text-sm font-extrabold tracking-widest text-indigo-700">${esc(code)}</span></div>
      <div class="mt-3 grid grid-cols-2 gap-3"><button data-act="copy" data-v="${esc(link)}" class="rounded-xl bg-indigo-50 py-2.5 text-sm font-semibold text-indigo-700"><i class="fa-solid fa-copy mr-1"></i>Copy Link</button><button data-act="copy" data-v="${esc(refMsg())}" class="btn-primary rip rounded-xl py-2.5 text-sm font-semibold text-white"><i class="fa-solid fa-message mr-1"></i>Copy Message</button></div></div>
    <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Share with friends</p>
    <div class="mb-3 grid grid-cols-4 gap-2">${sb('wa', 'fa-brands fa-whatsapp', 'WhatsApp', 'bg-emerald-500')}${sb('tg', 'fa-brands fa-telegram', 'Telegram', 'bg-sky-500')}${sb('ig', 'fa-brands fa-instagram', 'Instagram', 'bg-fuchsia-500')}${sb('more', 'fa-solid fa-share-nodes', 'More', 'bg-slate-700')}</div>
    <div class="mb-5 ${CARD} p-3.5"><p class="mb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Your share message</p><p class="selectable whitespace-pre-line text-xs leading-relaxed text-slate-600">${esc(refMsg())}</p></div>
    <div class="mb-5 grid grid-cols-2 gap-3"><div class="${CARD} p-4"><p class="text-xs text-slate-500">Total Referrals</p><p class="mt-1 text-xl font-bold">${list.length}</p></div><div class="${CARD} p-4"><p class="text-xs text-slate-500">Total Earned</p><p class="mt-1 text-xl font-bold">${esc(money(earned))}</p></div></div>
    <h2 class="mb-3 text-base font-bold">Your Referrals</h2>
    ${!list.length ? emptyBox('fa-user-group', 'No referrals yet.', 'Share your code to start earning.') : `<div class="divide-y divide-slate-100 ${CARD}">${list.map(r => `<div class="flex items-center justify-between gap-3 p-3.5"><div class="min-w-0"><p class="truncate text-sm font-semibold">${esc(r.name)}</p><p class="text-xs text-slate-400">Joined ${esc(fmt(r.createdAt))}</p></div>${r.rewarded ? `<span class="shrink-0 text-sm font-bold text-emerald-600">+ ${esc(money(r.amount))}</span>` : `<span class="shrink-0 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700"><i class="fa-solid fa-clock mr-1"></i>${Math.min(r.done || 0, need)}/${need} tasks</span>`}</div>`).join('')}</div>`}`;
};

// ---- Terms, Privacy, Contact
const LEGAL = {
  terms: ['Terms & Conditions', [
    ['Acceptance', 'By creating an account or using this app you agree to these Terms. If you do not agree, please do not use the app. You must be 18 years or older.'],
    ['Your account', 'Provide correct information and keep your password safe. One person may hold only one account. You are responsible for all activity on your account.'],
    ['Tasks and rewards', 'Rewards are credited only after a task is completed and verified, either automatically or by an admin. Fake, edited or reused proof, bots, emulators, VPN or any other trick will lead to rejection, balance forfeiture and a permanent ban. Task rewards, limits and availability can change at any time.'],
    ['Wallet and redeem', 'Redeem requests are subject to the minimum and maximum limits shown in the app and are processed manually, which can take time. Make sure your UPI ID is correct, because payments sent to a wrong ID cannot be recovered. Gift card codes are delivered in the app after approval.'],
    ['Add Coins', 'Coins added by UPI payment are credited after the payment is verified using the UTR you submit. Submitting a false or duplicate UTR is fraud and will lead to a ban. Added coins are intended for promotions and tasks inside the app.'],
    ['Promotions', 'If you promote your app or channel you confirm that it is legal and safe and does not contain harmful, adult or misleading content. We may reject any promotion and refund the amount.'],
    ['Referrals', 'A referral reward is paid once, after your friend completes the required number of tasks. Self-referrals and fake accounts are not allowed.'],
    ['Ads', 'The app may show third party ads and sponsored offers. We are not responsible for the content or services of advertisers.'],
    ['Suspension', 'We may suspend or close accounts that break these Terms or harm the app or other users, and we may change or stop the service at any time.'],
    ['Liability', 'The app is provided as is. To the extent allowed by law we are not liable for indirect losses, missed earnings or service interruptions.'],
    ['Changes and contact', 'We may update these Terms. Continued use means you accept the changes. Questions: see the Contact Us page.']]],
  privacy: ['Privacy Policy', [
    ['What we collect', 'Your name, mobile number, account ID, task activity, wallet and transaction history, proof screenshots you upload, UPI IDs and UTR numbers you submit, and basic device and browser information.'],
    ['Why we use it', 'To run your account, verify tasks, pay rewards, prevent fraud and misuse, show your leaderboard rank, and improve the app.'],
    ['Watch time tracking', 'For Watch & Earn tasks that are verified automatically, the app measures how long the video plays on your screen. This happens only after you allow it and only while the task is open. No camera, microphone, contacts or files are accessed.'],
    ['Services we use', 'We use Google Firebase (login and database), YouTube video playback, and advertising partners. These services may process technical data under their own privacy policies.'],
    ['Sharing', 'We do not sell your personal data. Your first name and last initial and your earnings can appear on the leaderboard. Data may be shared when required by law or to prevent fraud.'],
    ['Security and retention', 'We use reasonable measures to protect your data. We keep it while your account is active and as needed for legal and fraud-prevention reasons.'],
    ['Your choices', 'You can edit your name in your profile. To request deletion of your account and data, email us from the Contact Us page.'],
    ['Children', 'The app is not meant for people under 18 and we do not knowingly collect their data.'],
    ['Updates', 'We may update this policy. The latest version is always available in the app.']]]
};
const legalPage = k => `${backBtn('#/profile', LEGAL[k][0])}<p class="mb-4 text-xs text-slate-400">Last updated: October 2026</p><div class="space-y-3">${LEGAL[k][1].map(([h, t], i) => `<div class="${CARD} p-4"><h3 class="mb-1 text-sm font-bold"><span class="mr-1.5 text-indigo-600">${i + 1}.</span>${esc(h)}</h3><p class="text-sm leading-relaxed text-slate-600">${esc(t)}</p></div>`).join('')}</div>`;
views.terms = () => legalPage('terms');
views.privacy = () => legalPage('privacy');
views.contact = () => `${backBtn('#/profile', 'Contact Us')}<div class="${CARD} p-5 text-center"><span class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-50 text-2xl text-indigo-600"><i class="fa-solid fa-envelope"></i></span>
  <p class="text-base font-bold">We are here to help</p><p class="mt-1 text-sm text-slate-500">Write to us about payments, rewards, your account or any problem. Please include your registered mobile number.</p>
  <p class="selectable mt-4 break-all text-sm font-bold text-indigo-600">${esc(cfg('support_email'))}</p>
  <div class="mt-4 grid grid-cols-2 gap-3"><a href="mailto:${esc(cfg('support_email'))}?subject=${ENC(cfg('site_name') + ' Support')}" class="btn-primary rip flex items-center justify-center gap-2 rounded-xl py-3 text-sm font-semibold text-white"><i class="fa-solid fa-paper-plane"></i>Send Email</a><button data-act="copy" data-v="${esc(cfg('support_email'))}" class="rounded-xl bg-indigo-50 py-3 text-sm font-semibold text-indigo-700"><i class="fa-solid fa-copy mr-1"></i>Copy Email</button></div>
  <p class="mt-4 text-xs text-slate-400">We usually reply within 48 hours.</p></div>`;
const legalMenu = () => `<div class="mb-5 divide-y divide-slate-100 ${CARD}">${[['#/addmoney', 'fa-circle-plus', 'Add Coins'], ['#/terms', 'fa-file-contract', 'Terms &amp; Conditions'], ['#/privacy', 'fa-user-shield', 'Privacy Policy'], ['#/contact', 'fa-envelope', 'Contact Us']].map(([h, i, l]) => `<a href="${h}" class="flex items-center justify-between p-4 text-sm font-semibold text-slate-700"><span class="flex items-center gap-3"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-50 text-indigo-600"><i class="fa-solid ${i}"></i></span>${l}</span><i class="fa-solid fa-chevron-right text-xs text-slate-400"></i></a>`).join('')}</div>`;

// ---- Partners page (offerwalls, surveys, games)
S.partners = {};
const DEFAULT_PARTNERS = [['pubscale', 'PubScale', 'task', 30], ['timewall', 'TimeWalls', 'task', 20], ['cpidroid', 'Cpi Droid', 'task', 0], ['cpx', 'CPX Research', 'survey', 35], ['pollreach', 'Poll Reach', 'survey', 20], ['theoremreach', 'Theorem Reach', 'survey', 0], ['playtime', 'Playtime', 'gaming', 0], ['spawntap', 'SpawnTap', 'gaming', 0], ['capsbit', 'Capsbit', 'gaming', 0]];
const CATS = { task: 'Task Partners', survey: 'Survey Partners', gaming: 'Gaming Partners' };
const PCOLS = { task: ['#22d3ee', '#3b82f6'], survey: ['#c4b5fd', '#6366f1'], gaming: ['#60a5fa', '#a855f7'] };
const partnerList = () => (Object.keys(S.partners || {}).length ? Object.entries(S.partners).map(([id, p]) => ({ ...p, id })) : DEFAULT_PARTNERS.map(([id, name, category, bonus], i) => ({ id, name, category, bonus, order: i + 1, enabled: true }))).filter(p => p.enabled !== false).sort((a, b) => (a.order || 0) - (b.order || 0));
views.partners = function () {
  const list = partnerList();
  const tile = p => { const [c1, c2] = PCOLS[p.category] || PCOLS.task;
    return `<div><button data-act="partner" data-id="${esc(p.id)}" class="rip relative block aspect-square w-full overflow-hidden rounded-[22px] p-[2px] ${p.url ? '' : 'opacity-70'}" style="background:linear-gradient(135deg,${c1},${c2});box-shadow:0 8px 22px ${c2}55"><span class="absolute inset-[2px] rounded-[20px] bg-slate-950"></span>
      ${p.bonus ? `<span class="absolute inset-x-[2px] top-[2px] z-10 rounded-t-[20px] bg-violet-600 py-1 text-center text-[10px] font-extrabold tracking-wider text-white">${esc(p.bonus)}% BONUS</span>` : ''}
      <span class="relative z-10 flex h-full w-full items-center justify-center p-3 ${p.bonus ? 'pt-6' : ''}">${p.logo ? `<img src="${esc(p.logo)}" alt="" class="max-h-full max-w-full object-contain">` : `<span class="text-center text-[15px] font-extrabold leading-tight text-white">${esc(p.name)}</span>`}</span>${p.url ? '' : '<span class="absolute bottom-1.5 left-0 right-0 z-10 text-center text-[9px] font-bold uppercase tracking-wider text-slate-400">Soon</span>'}</button>
      <p class="mt-2 text-center text-xs font-bold">${esc(p.name)}</p></div>`; };
  const sec = k => { const items = list.filter(p => p.category === k); return items.length ? `<div class="mb-6"><div class="mb-3 flex items-center gap-2.5"><span class="flex h-8 w-8 items-center justify-center rounded-xl bg-white text-slate-900 shadow"><i class="fa-solid fa-star text-sm"></i></span><h2 class="text-sm font-extrabold uppercase tracking-widest">${CATS[k]}</h2></div><div class="grid grid-cols-3 gap-3">${items.map(tile).join('')}</div></div>` : ''; };
  return `<h1 class="text-xl font-bold">Offers &amp; Partners</h1><p class="mb-5 text-sm text-slate-500">Complete offers, surveys and games from our partners. Rewards are added to your wallet automatically after the partner confirms.</p>${Object.keys(CATS).map(sec).join('')}`;
};
function openPartner(id) {
  const p = partnerList().find(x => x.id === id); if (!p) return;
  if (!p.url) return flash('error', p.name + ' will be available soon.');
  const uid = S.user.uid, u = p.url.split('{uid}').join(uid).split('{user_id}').join(uid).split('{userid}').join(uid);
  let m = $('#pSheet'); if (!m) { m = document.createElement('div'); m.id = 'pSheet'; m.className = 'fixed inset-0 z-[85] flex flex-col bg-white';
    m.addEventListener('click', e => { if (e.target.closest('[data-ps=close]')) m.classList.add('hidden'), (m.querySelector('iframe').src = 'about:blank'); }); document.body.appendChild(m); }
  m.innerHTML = `<div class="flex items-center justify-between gap-2 border-b border-slate-100 px-3 pb-2" style="padding-top:calc(8px + var(--sat))"><p class="truncate text-sm font-bold">${esc(p.name)}</p><div class="flex shrink-0 gap-2"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer" class="rounded-lg bg-indigo-50 px-3 py-2 text-xs font-semibold text-indigo-700"><i class="fa-solid fa-up-right-from-square mr-1"></i>Browser</a><button data-ps="close" class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-100 text-slate-600"><i class="fa-solid fa-xmark"></i></button></div></div><iframe src="${esc(u)}" class="w-full flex-1 border-0" allow="autoplay; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
  m.classList.remove('hidden');
}

// ---- click / submit hooks used by the main handlers
function extClick(b, a) {
  if (a === 'partner') { openPartner(b.dataset.id); return true; }
  if (a === 'consent') { lsSet('te_watch_ok', '1'); S.consentDenied = false; render(true); return true; }
  if (a === 'denyconsent') { S.consentDenied = true; render(true); return true; }
  if (a === 'share') { shareTo(b.dataset.v); return true; }
  if (a === 'rewarded') { openRewarded(); return true; }
  if (a === 'payreset') { S.pay = null; render(true); return true; }
  return false;
}
function extSubmit(f, k) {
  if (k === 'payamt') { const amt = parseMoney(f.amount.value), min = cfg('add_min'), max = cfg('add_max'); if (!amt || amt < min) flash('error', 'Minimum amount is ' + money(min) + '.'); else if (amt > max) flash('error', 'Maximum amount is ' + money(max) + '.'); else { S.pay = { amt }; render(true); } return true; }
  if (k === 'utr') { busy(() => doDeposit(f)); return true; }
  return false;
}

// ================= events =================
document.addEventListener('contextmenu', e => e.preventDefault());
$('#auth').addEventListener('click', e => { if (e.target.closest('[data-act="mode"]')) { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; S.authErr = ''; renderAuth(true); } });
$('#auth').addEventListener('submit', e => { e.preventDefault(); const f = e.target; busy(() => f.dataset.form === 'signup' ? doSignup(f) : doLogin(f)); });
$('#shell').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (extClick(b, a)) return;
  if (a === 'cat') { S.cat = b.dataset.v; render(true); }
  else if (a === 'more') { S.txShown += 20; render(true); }
  else if (a === 'method') { S.method = b.dataset.v; render(true); }
  else if (a === 'preset') { const i = document.querySelector('#view input[name=amount]'); if (i) i.value = b.dataset.v; }
  else if (a === 'complete') busy(() => completeTask(b.dataset.id, null));
  else if (a === 'logout') signOut(auth);
  else if (a === 'copy') { const t = b.dataset.v, old = b.innerHTML, done = () => { b.innerHTML = '<i class="fa-solid fa-check mr-1"></i>Copied'; setTimeout(() => b.innerHTML = old, 1500); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done); else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); done(); } }
});
$('#shell').addEventListener('input', e => { if (e.target.name === 'pqty') { const q = parseInt(e.target.value, 10) || 0; $('#promoCost').textContent = 'Total cost: ' + money(q * cfg('promo_price')); } });
$('#shell').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, k = f.dataset.form;
  if (extSubmit(f, k)) return;
  if (k === 'proof') busy(() => completeTask(f.dataset.id, f.proof.files[0]));
  else if (k === 'withdraw') busy(() => doWithdraw(f.upi ? f.upi.value.trim() : '', f.amount.value));
  else if (k === 'promote') busy(() => doPromote(f));
  else if (k === 'name') busy(async () => { const n = f.name.value.trim(); if (n.length < 2 || n.length > 60) return flash('error', 'Please enter a valid name (2-60 characters).'); try { await set(ref(db, `users/${S.user.uid}/name`), n); flash('success', 'Profile updated.'); } catch (_) { flash('error', 'Could not update profile.'); } });
});

// ================= data + boot =================
function listen(path, key, q) { unsubs.push(onValue(q || ref(db, path), s => { S[key] = s.val() || {}; S._loaded[key] = true; delete S.errs[key]; if (key === 'tx' || key === 'lb') maybeSyncLb(); if (key === 'ads') updateAds(); render(); }, e => { S.errs[key] = e.message; S._loaded[key] = true; console.error(path, e.message); render(); })); }
async function boot(u) {
  S.user = u;
  const snap = await get(ref(db, 'users/' + u.uid));
  if (!snap.exists()) { S.authErr = 'Account profile not found. Please create an account.'; await signOut(auth); return; }
  if (snap.val().status === 'blocked') { S.authErr = 'Your account has been blocked. Please contact support.'; await signOut(auth); return; }
  S.profile = snap.val(); const uid = u.uid;
  listen('tasks', 'tasks'); listen('taskStats', 'stats'); listen('userTasks/' + uid, 'ut'); listen('withdrawals/' + uid, 'wd'); listen('referrals/' + uid, 'refs');
  listen('', 'tx', query(ref(db, 'transactions/' + uid), limitToLast(300)));
  listen('promos/' + uid, 'promos'); listen('', 'lb', query(ref(db, 'leaderboard'), orderByChild('earned'), limitToLast(50)));
  listen('deposits/' + uid, 'dep'); listen('ads', 'ads'); listen('partners', 'partners');
  unsubs.push(onValue(ref(db, `adViews/${uid}/${todayStr()}`), x => { S.advToday = x.val() || 0; render(); }, () => {}));
  unsubs.push(onValue(ref(db, 'users/' + uid), s => { const v = s.val(); if (!v) return; if (v.status === 'blocked') { S.authErr = 'Your account has been blocked. Please contact support.'; signOut(auth); return; } S.profile = v; render(); }));
  buildShell(); hideBoot(); $('#auth').classList.add('hidden'); $('#shell').classList.remove('hidden'); render(true);
}
onValue(ref(db, 'settings'), s => { S.settings = s.val() || {}; document.title = cfg('site_name'); document.querySelectorAll('.js-site').forEach(e => e.textContent = cfg('site_name')); if (!S.user) renderAuth(); else render(); });
const qref = new URLSearchParams(location.search).get('ref');
if (qref) { S.authMode = 'signup'; S.refPrefill = qref.toUpperCase().replace(/[^A-Z0-9]/g, ''); }
onAuthStateChanged(auth, async u => {
  authResolved = true;
  if (S.signingUp) return;
  if (u) { await boot(u); }
  else { teardown(); hideBoot(); $('#shell').classList.add('hidden'); $('#auth').classList.remove('hidden'); renderAuth(true); }
});
</script>
</body>
</html>
