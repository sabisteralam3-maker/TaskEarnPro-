<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>TaskEarnPro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html,body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
  body{-webkit-user-select:none;user-select:none;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  input,textarea,select,.selectable{-webkit-user-select:text;user-select:text}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}

  body{background:#eef1ff;background-image:radial-gradient(55% 38% at 12% 0%,rgba(99,102,241,.40),transparent 62%),radial-gradient(45% 36% at 100% 12%,rgba(168,85,247,.30),transparent 62%),radial-gradient(60% 45% at 0% 100%,rgba(56,189,248,.30),transparent 62%),radial-gradient(45% 35% at 100% 100%,rgba(244,114,182,.18),transparent 62%);background-attachment:scroll}
  .glass{background:linear-gradient(135deg,rgba(255,255,255,.74),rgba(255,255,255,.46));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(49,46,129,.10),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35)}
  .glass-strong{background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.64));-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid rgba(255,255,255,.85);box-shadow:0 14px 40px rgba(49,46,129,.16),inset 0 1px 0 #fff}
  .glass-bar{background:rgba(255,255,255,.60);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.75);box-shadow:0 4px 24px rgba(49,46,129,.06)}
  .glass-chip{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(49,46,129,.05)}
  .glass-input{background:rgba(255,255,255,.55)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9)!important;box-shadow:inset 0 1px 3px rgba(49,46,129,.10)}
  .glass-input:focus{background:rgba(255,255,255,.9)!important;border-color:#6366f1!important}
  .hero{position:relative;background:linear-gradient(135deg,rgba(79,70,229,.95),rgba(139,92,246,.88));border:1px solid rgba(255,255,255,.35);box-shadow:0 18px 40px rgba(79,70,229,.35),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12)}
  .hero::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.30),transparent 42%);pointer-events:none}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#7c3aed);border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 20px rgba(99,102,241,.35),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,filter .15s}
  .btn-primary:active{transform:scale(.98);filter:brightness(.95)}
  
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  @supports not (backdrop-filter:blur(1px)){.glass,.glass-strong,.glass-bar,.glass-chip{background:rgba(255,255,255,.94)}}

  .splash-pop{animation:spop .9s cubic-bezier(.2,.9,.3,1.15) both}@keyframes spop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  .splash-glow{animation:sglow 2.2s ease-in-out infinite}@keyframes sglow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.18)}}
  .splash-bar{width:0;animation:sload 1.8s ease forwards}@keyframes sload{to{width:100%}}

  :root{--env-t:env(safe-area-inset-top,0px);--env-b:env(safe-area-inset-bottom,0px);--wv-t:0px;--wv-b:0px;--sat:max(var(--env-t),var(--wv-t));--sab:max(var(--env-b),var(--wv-b))}
  html.wv{--wv-t:34px;--wv-b:14px}
  html{scroll-behavior:smooth}
  .app-header{padding-top:var(--sat);min-height:calc(56px + var(--sat))}
  .side-top{padding-top:calc(16px + var(--sat))}
  .bottom-nav{bottom:calc(12px + var(--sab))}
  .auth-wrap{padding-top:calc(40px + var(--sat))}
  .hero{overflow:hidden}
  .hero::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 5.5s ease-in-out infinite;pointer-events:none}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  #view.enter>*{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
  #view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}#view.enter>*:nth-child(4){animation-delay:.15s}#view.enter>*:nth-child(n+5){animation-delay:.2s}
  .enter .stagger>*{animation:rise .6s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*80ms + 150ms)}
  #flashBox>div{animation:pop .45s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
  .modal-pop{animation:sheet .45s cubic-bezier(.22,1,.36,1) both}@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .rip{position:relative;overflow:hidden}
  .ripple{position:absolute;border-radius:9999px;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .65s ease-out;pointer-events:none}
  @keyframes ripple{to{transform:scale(4);opacity:0}}
  .skel{background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.9),rgba(255,255,255,.4));background-size:200% 100%;animation:skel 1.3s linear infinite}
  @keyframes skel{to{background-position:-200% 0}}
  .tab .pill{transition:background-color .35s,transform .35s cubic-bezier(.22,1,.36,1)}
  .tab.text-indigo-600 .pill{transform:translateY(-2px) scale(1.07)}
  button,.glass-chip{transition:transform .18s cubic-bezier(.22,1,.36,1)}
  button:active,.glass-chip:active{transform:scale(.97)}
  #wvHost iframe,#xwHost iframe{width:100%;height:100%}
  #wheel{transition:transform 4.4s cubic-bezier(.12,.7,.08,1)}
  .btn-start{position:relative;overflow:hidden;color:#fff;background:linear-gradient(110deg,#6366f1,#8b5cf6,#d946ef,#6366f1);background-size:250% 100%;border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 24px rgba(99,102,241,.4),inset 0 1px 0 rgba(255,255,255,.5);animation:startflow 3.5s linear infinite,startpulse 2s ease-in-out infinite}
  .btn-start::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.4s ease-in-out infinite;pointer-events:none}
  .btn-start i{animation:nudge 1.2s ease-in-out infinite}
  @keyframes startflow{to{background-position:250% 0}}
  @keyframes startpulse{0%,100%{box-shadow:0 10px 24px rgba(99,102,241,.4),0 0 0 0 rgba(139,92,246,.5)}50%{box-shadow:0 10px 24px rgba(99,102,241,.4),0 0 0 10px rgba(139,92,246,0)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  @keyframes shine{0%{left:-70%}60%,100%{left:130%}}
  .nav-center{position:relative;top:-22px}
  .nav-orb{width:60px;height:60px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;background:linear-gradient(135deg,#f59e0b,#ec4899 55%,#8b5cf6);border:2px solid rgba(255,255,255,.85);box-shadow:0 12px 28px rgba(236,72,153,.45),inset 0 1px 0 rgba(255,255,255,.55);animation:orbpulse 2.2s ease-in-out infinite}
  .nav-orb i{animation:orbwob 3s ease-in-out infinite}
  .nav-center.text-indigo-600 .nav-orb{transform:scale(1.06)}
  @keyframes orbpulse{0%,100%{box-shadow:0 12px 28px rgba(236,72,153,.45),0 0 0 0 rgba(236,72,153,.55)}50%{box-shadow:0 12px 28px rgba(236,72,153,.45),0 0 0 14px rgba(236,72,153,0)}}
  @keyframes orbwob{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.14)}}

  .flame{display:inline-block;transform-origin:50% 90%;animation:flame .9s ease-in-out infinite}
  .hot{position:relative;overflow:hidden;color:#fff;border:1px solid rgba(255,255,255,.5);background:linear-gradient(110deg,#f97316,#ef4444,#ec4899,#f97316);background-size:300% 100%;animation:hotflow 3s linear infinite,hotpulse 1.6s ease-in-out infinite,hotshake 4.5s ease-in-out infinite;box-shadow:0 12px 30px rgba(239,68,68,.45),inset 0 1px 0 rgba(255,255,255,.6)}
  .hot::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 130%,rgba(255,226,120,.6),transparent 55%);animation:hotglow 1.3s ease-in-out infinite alternate;pointer-events:none}
  .hot::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 2.2s ease-in-out infinite;pointer-events:none}
  .hot-tag{animation:blink 1s steps(2,start) infinite}
  @keyframes hotflow{to{background-position:300% 0}}
  @keyframes hotpulse{0%,100%{box-shadow:0 12px 30px rgba(239,68,68,.45),0 0 0 0 rgba(249,115,22,.65)}50%{box-shadow:0 12px 30px rgba(239,68,68,.45),0 0 0 14px rgba(249,115,22,0)}}
  @keyframes hotshake{0%,84%,100%{transform:none}86%{transform:rotate(-1.4deg) scale(1.03)}88%{transform:rotate(1.4deg) scale(1.03)}90%{transform:rotate(-1deg) scale(1.02)}92%{transform:rotate(1deg)}94%{transform:none}}
  @keyframes hotglow{from{opacity:.45}to{opacity:1}}
  @keyframes flame{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.28) rotate(6deg)}}
  @keyframes blink{50%{opacity:.3}}

  .live-card{position:relative;border-radius:22px;padding:2px;background:linear-gradient(120deg,#22d3ee,#6366f1,#f472b6,#22d3ee);background-size:300% 300%;animation:ringflow 4s linear infinite}
  @keyframes ringflow{to{background-position:300% 0}}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:9999px;background:#22c55e;animation:livepulse 1.6s ease-out infinite}
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .live-pill{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4ade80;background:rgba(34,197,94,.14)}
  /* phones: keep the look, but drop the expensive repaint effects (box-shadow / background-position loops, big blur) */
  html.lite .glass,html.lite .glass-strong,html.lite .glass-bar,html.lite .glass-chip,html.lite .glass-input{-webkit-backdrop-filter:blur(10px) saturate(130%);backdrop-filter:blur(10px) saturate(130%)}
  html.lite body{background-attachment:scroll}
  html.lite .hero::after,html.lite .btn-start::after,html.lite .hot::after,html.lite .hot::before,html.lite .ripple{display:none}
  html.lite .btn-start{animation:none;background:linear-gradient(110deg,#6366f1,#8b5cf6,#d946ef)}
  html.lite .btn-start i{animation:nudge 1.2s ease-in-out infinite}
  html.lite .hot{animation:hotshake 4.5s ease-in-out infinite;background:linear-gradient(110deg,#f97316,#ef4444,#ec4899)}
  html.lite .hot-tag{animation:none}
  html.lite .nav-orb{animation:none}
  html.lite .nav-orb i{animation:orbwob 3s ease-in-out infinite}
  html.lite .skel{animation:none;background:rgba(255,255,255,.75)}
  html.lite .live-card,html.lite .live-dot{animation:none}
  html.lite .live-card{background:linear-gradient(120deg,#22d3ee,#6366f1)}
  html.lite #view.enter>*{animation-duration:.4s}
</style>
</head>

// Resize + re-encode an image in the browser (also proves it is a real image). Stored as a small JPEG data URL.
function compress(file, max, q, crop169) {
  return new Promise((res, rej) => {
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return rej(new Error('Only JPG, PNG or WEBP images are allowed.'));
    if (file.size > 8 * 1024 * 1024) return rej(new Error('Image is too large. Maximum size is 8 MB.'));
    const r = new FileReader();
    r.onerror = () => rej(new Error('Could not read the image.'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('The file is not a valid image.'));
      img.onload = () => {
        const c = document.createElement('canvas'), x = c.getContext('2d');
        if (crop169) { c.width = 640; c.height = 360; const k = Math.max(640 / img.width, 360 / img.height), w = img.width * k, h = img.height * k; x.drawImage(img, (640 - w) / 2, (360 - h) / 2, w, h); }
        else { const k = Math.min(1, max / Math.max(img.width, img.height)); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); x.drawImage(img, 0, 0, c.width, c.height); }
        res(c.toDataURL('image/jpeg', q));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

// Every balance change is followed by a transaction record.
async function credit(uid, amt, reason, lb) {
  await runTransaction(ref(db, `users/${uid}/balance`), c => (c || 0) + amt);
  await set(push(ref(db, `transactions/${uid}`)), { type: 'credit', amount: amt, reason, ts: serverTimestamp() });
  if (lb) { try { await runTransaction(ref(db, `leaderboard/${uid}/earned`), c => (c || 0) + amt); await set(ref(db, `leaderboard/${uid}/name`), S.profile.name); } catch (_) { /* leaderboard is optional */ } }
}
const activeTasks = () => Object.entries(S.tasks).map(([id, t]) => ({ ...t, id })).filter(t => t.status === 'active').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const taskReward = t => t.type === 'daily' ? cfg('daily_checkin_reward') : (t.reward || 0);
const needsProof = t => t.type !== 'daily' && !!t.proofRequired && !isAutoWatch(t);
function taskState(t) {
  const rec = S.ut[t.id];
  if (t.type === 'daily') return rec && rec.date === todayStr() && rec.status === 'approved' ? 'done' : 'available';
  if (rec && rec.status === 'approved') return 'done';
  if (rec && rec.status === 'pending') return 'pending';
  const max = t.maxCompletions || 0;
  if (max > 0 && (S.stats[t.id] || 0) >= max) return 'limit';
  return 'available';
}
const stateMsg = (s, t) => s === 'done' ? (t.type === 'daily' ? 'Already claimed. Come back tomorrow.' : 'Task already completed.') : s === 'pending' ? 'You already have a submission waiting for review.' : 'This task has reached its completion limit.';

async function completeTask(id, file, verified) {
  const t = S.tasks[id] && { ...S.tasks[id], id };
  if (!t || t.status !== 'active') return flash('error', 'Task not found or no longer available.');
  const st = taskState(t);
  if (st !== 'available') return flash('error', stateMsg(st, t));
  if (isAutoWatch(t) && !verified) return flash('error', 'Watch the video to complete this task.');
  const uid = S.user.uid;
  const rec = { title: t.title, type: t.type, reward: taskReward(t), ts: serverTimestamp(), date: todayStr() };
  try {
    if (needsProof(t)) {
      if (!file) return flash('error', 'Please choose a proof image.');
      const img = await compress(file, 900, 0.72);
      await set(ref(db, `proofs/${uid}/${id}`), img);
      await set(ref(db, `userTasks/${uid}/${id}`), { ...rec, status: 'pending' });           // one record per user+task = no duplicates
      await runTransaction(ref(db, `taskStats/${id}`), c => (c || 0) + 1);
      flash('success', 'Proof submitted. Waiting for admin review.');
    } else {
      await set(ref(db, `userTasks/${uid}/${id}`), { ...rec, status: 'approved' });          // rules reject a second claim
      if (rec.reward > 0) await credit(uid, rec.reward, t.type === 'daily' ? 'Daily check-in reward' : 'Task completed: ' + t.title, true);
      if (t.type !== 'daily') await runTransaction(ref(db, `taskStats/${id}`), c => (c || 0) + 1);
      flash('success', t.type === 'daily' ? 'Daily reward claimed. Come back tomorrow.' : 'Task completed. Reward added to your wallet.');
    }
    onTaskDone();
  } catch (e) { flash('error', isPerm(e) ? 'Task already completed or not available.' : (e.message || 'Something went wrong.')); }
}

async function doWithdraw(upi, amtStr) {
  const mk = S.method, m = METHODS[mk], amt = parseMoney(amtStr), uid = S.user.uid, min = cfg(m.min), max = cfg(m.max);
  const fee = mk === 'upi' && amt ? Math.round(amt * (cfg('upi_fee_pct') || 0) / 100) : 0;   // UPI service fee, taken from the amount
  if (mk === 'upi' && !/^[a-zA-Z0-9._-]{2,64}@[a-zA-Z]{2,32}$/.test(upi)) return flash('error', 'Invalid UPI ID.');
  if (!amt || amt <= 0) return flash('error', 'Enter a valid amount.');
  if (amt < min) return flash('error', 'Minimum for ' + m.label + ' is ' + money(min) + '.');
  if (amt > max) return flash('error', 'Maximum for ' + m.label + ' is ' + money(max) + '.');
  if ((S.profile.balance || 0) < amt) return flash('error', 'Insufficient wallet balance.');
  try {
    // 1) debit atomically (aborts if balance is too low)
    const r = await runTransaction(ref(db, `users/${uid}/balance`), c => (typeof c === 'number' && c >= amt) ? c - amt : (c === null ? 0 : undefined));
    if (!r.committed) return flash('error', 'Insufficient wallet balance.');
    // 2) create the request + transaction record. If this fails we refund.
    const wref = push(ref(db, `withdrawals/${uid}`));
    try {
      const rec = { uid, name: S.profile.name, mobile: S.profile.mobile, method: mk, amount: amt, status: 'pending', createdAt: serverTimestamp() };
      if (mk === 'upi') { rec.upi = upi; rec.fee = fee; rec.net = amt - fee; }
      await set(wref, rec);
      await set(push(ref(db, `transactions/${uid}`)), { type: 'debit', amount: amt, reason: 'Redeem request (' + m.label + (fee ? ', fee ' + money(fee) : '') + ')', ref: wref.key, ts: serverTimestamp() });
      flash('success', 'Redeem request submitted.' + (fee ? ' You will receive ' + money(amt - fee) + ' after the ' + cfg('upi_fee_pct') + '% fee.' : ''));
    } catch (e2) { await runTransaction(ref(db, `users/${uid}/balance`), c => (c || 0) + amt); flash('error', 'Could not submit the request. Please try again.'); }
  } catch (e) { flash('error', 'Something went wrong. Please try again.'); }
}

// Promote your own app / channel: the advertiser pays from the wallet, admin approves, and it becomes a task for everyone.
async function doPromote(f) {
  const name = f.pname.value.trim(), url = f.purl.value.trim(), type = f.ptype.value, qty = parseInt(f.pqty.value, 10), note = f.pnote.value.trim(), uid = S.user.uid;
  if (name.length < 2 || name.length > 60) return flash('error', 'Enter the app or channel name (2-60 characters).');
  if (!/^https?:\/\/\S+$/i.test(url) || url.length > 300) return flash('error', 'Enter a valid link starting with http:// or https://');
  if (!['install', 'review', 'channel', 'watch'].includes(type)) return flash('error', 'Choose a task type.');
  if (!(qty >= 10 && qty <= 1000)) return flash('error', 'Quantity must be between 10 and 1000.');
  const price = cfg('promo_price'), cost = qty * price;
  if ((S.profile.balance || 0) < cost) return flash('error', 'Insufficient wallet balance. You need ' + money(cost) + '.');
  const r = await runTransaction(ref(db, `users/${uid}/balance`), c => (typeof c === 'number' && c >= cost) ? c - cost : (c === null ? 0 : undefined));
  if (!r.committed) return flash('error', 'Insufficient wallet balance.');
  const pref = push(ref(db, `promos/${uid}`));
  try {
    await set(pref, { name, url, type, qty, cost, rewardPer: cfg('promo_reward'), note: note.slice(0, 200), status: 'pending', createdAt: serverTimestamp() });
    await set(push(ref(db, `transactions/${uid}`)), { type: 'debit', amount: cost, reason: 'Promotion: ' + name, ref: pref.key, ts: serverTimestamp() });
    f.reset(); flash('success', 'Promotion submitted. It goes live after admin approval.');
  } catch (e) { await runTransaction(ref(db, `users/${uid}/balance`), c => (c || 0) + cost); flash('error', 'Could not submit the promotion. Please try again.'); }
}

const authMsg = e => { const c = (e && e.code) || ''; return c.includes('email-already-in-use') ? 'This mobile number is already registered. Please login.' : /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? 'Invalid mobile number or password.' : c.includes('too-many-requests') ? 'Too many attempts. Please try again later.' : c.includes('network') ? 'Network error. Check your connection.' : c.includes('operation-not-allowed') ? 'Enable Email/Password sign-in in Firebase Authentication.' : 'Something went wrong. Please try again.'; };
const genCode = () => { const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; const a = crypto.getRandomValues(new Uint8Array(8)); a.forEach(n => s += ch[n % ch.length]); return s; };

async function doLogin(f) {
  const mobile = f.mobile.value.replace(/\D/g, ''), pass = f.password.value;
  S.authErr = '';
  try { await signInWithEmailAndPassword(auth, `${mobile}@${DOMAIN}`, pass); } catch (e) { S.authErr = authMsg(e); renderAuth(true); }
}
async function doSignup(f) {
  const name = f.name.value.trim(), mobile = f.mobile.value.replace(/\D/g, ''), pass = f.password.value, pass2 = f.confirm.value, rc = f.refcode.value.trim().toUpperCase();
  S.refPrefill = rc;
  const bad = name.length < 2 || name.length > 60 ? 'Please enter your full name (2-60 characters).' : !/^[0-9]{10}$/.test(mobile) ? 'Enter a valid 10-digit mobile number.' : pass.length < 6 ? 'Password must be at least 6 characters.' : pass !== pass2 ? 'Passwords do not match.' : '';
  if (bad) { S.authErr = bad; return renderAuth(true); }
  let referrer = null;
  try {
    if (rc) { const s = await get(ref(db, 'referralCodes/' + rc)); if (!s.exists()) { S.authErr = 'Invalid referral code.'; return renderAuth(true); } referrer = s.val(); }
    S.signingUp = true; S.authErr = '';
    const cred = await createUserWithEmailAndPassword(auth, `${mobile}@${DOMAIN}`, pass);
    const uid = cred.user.uid;
    let code = null;
    for (let i = 0; i < 6 && !code; i++) { const c = genCode(); try { await set(ref(db, 'referralCodes/' + c), uid); code = c; } catch (e) { /* code taken, try another */ } }
    if (!code) throw new Error('code');
    await set(ref(db, 'users/' + uid), { name, mobile, referralCode: code, referredBy: referrer, status: 'active', balance: 0, createdAt: serverTimestamp() });
    if (referrer) await set(ref(db, `referrals/${referrer}/${uid}`), { name, createdAt: serverTimestamp(), rewarded: false });
    const bonus = cfg('welcome_bonus'); if (bonus > 0) await credit(uid, bonus, 'Welcome bonus');
    try { await set(ref(db, `leaderboard/${uid}/name`), name); await set(ref(db, `leaderboard/${uid}/earned`), 0); } catch (_) { /* leaderboard row is optional */ }
    const fb = cfg('referee_bonus'); if (referrer && fb > 0) await credit(uid, fb, 'Referral bonus');
    S.signingUp = false; await boot(cred.user);
  } catch (e) { S.signingUp = false; S.authErr = authMsg(e); renderAuth(true); }
}

            <input type="file" name="proof" accept="image/jpeg,image/png,image/webp" required class="block w-full rounded-xl border border-slate-200 bg-slate-50 p-2.5 text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-indigo-700">
            <p class="mt-2 text-xs text-slate-500">JPG, PNG or WEBP. Maximum 8 MB.</p><button type="submit" class="${BTN} mt-4">Submit for Review</button></form>`
        : `<button data-act="complete" data-id="${id}" class="${BTN}"><i class="fa-solid ${t.type === 'daily' ? 'fa-calendar-check' : 'fa-circle-check'}"></i>${t.type === 'daily' ? 'Claim Daily Reward' : 'Complete Task'}</button>`;
    } else if (st === 'pending') action = `<div class="flex items-start gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800"><i class="fa-solid fa-clock mt-0.5 text-amber-500"></i><span>Proof submitted. Waiting for admin review.</span></div>`;
    else if (st === 'done') action = `<div class="flex items-start gap-3 rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800"><i class="fa-solid fa-circle-check mt-0.5 text-emerald-500"></i><span>${t.type === 'daily' ? 'Reward claimed today. Come back tomorrow.' : 'You have already completed this task.'}</span></div>`;
    else action = `<div class="flex items-start gap-3 rounded-2xl border border-slate-200 bg-slate-100 p-4 text-sm text-slate-600"><i class="fa-solid fa-ban mt-0.5"></i><span>This task has reached its completion limit.</span></div>`;
    return `${backBtn('#/home', 'Task Details')}<div class="overflow-hidden ${CARD}"><div class="h-40 w-full bg-indigo-50">${t.cover ? `<img src="${t.cover}" alt="" class="h-full w-full object-cover">` : `<div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-indigo-100 to-indigo-50 text-indigo-400"><i class="fa-solid ${icon} text-6xl"></i></div>`}</div>
      <div class="p-4"><div class="flex items-center justify-between gap-3"><span class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600"><i class="fa-solid ${icon}"></i>${esc(label)}</span>
      <span class="inline-flex items-center gap-1.5 btn-primary rounded-full px-3 py-1 text-sm font-bold text-white"><i class="fa-solid fa-coins text-xs"></i>+${esc(money(taskReward(t)))}</span></div>
      <h2 class="mt-2 text-xl font-bold leading-snug">${esc(t.title)}</h2>${dsteps.length ? '' : `<p class="mt-2 whitespace-pre-line text-sm text-slate-600">${esc(t.description)}</p>`}</div></div>
      <div class="mt-4 ${CARD} p-4"><h3 class="mb-3 text-base font-bold">How to Complete</h3><ol class="space-y-3">${(dsteps.length ? dsteps : isAutoWatch(t) ? watchSteps(t) : steps).map((s, i) => `<li class="flex items-start gap-3 text-sm text-slate-600"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-indigo-50 text-xs font-bold text-indigo-600">${i + 1}</span><span class="pt-0.5">${esc(s)}</span></li>`).join('')}</ol></div>
      ${tutorialBlock(t)}
      <div class="mt-4 space-y-3">${action}</div>`;
  },

  wallet() {
    const rows = Object.values(S.tx).sort((a, b) => (b.ts || 0) - (a.ts || 0)), shown = rows.slice(0, S.txShown);
    return `<div class="relative mb-6 overflow-hidden rounded-3xl hero p-5 text-white"><div class="absolute -right-8 -top-10 h-36 w-36 rounded-full bg-white/10"></div>
      <p class="relative text-xs font-medium text-indigo-100"><i class="fa-solid fa-coins mr-1.5"></i>Available Balance</p><p data-bal class="relative mt-1 text-3xl font-bold">${esc(money(S.profile.balance))}</p>
      <a href="#/withdraw" class="relative mt-4 inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2.5 text-sm font-semibold text-indigo-600"><i class="fa-solid fa-gift"></i>Redeem</a>
      <a href="#/addmoney" class="relative ml-2 mt-4 inline-flex items-center gap-2 rounded-xl border border-white/40 bg-white/20 px-4 py-2.5 text-sm font-semibold text-white"><i class="fa-solid fa-circle-plus"></i>Add Coins</a></div>
      <h2 class="mb-3 text-base font-bold">Transaction History</h2>
      ${!rows.length ? emptyBox('fa-receipt', 'No transactions yet.', 'Complete a task to earn your first reward.') :
      `<div class="divide-y divide-slate-100 ${CARD}">${shown.map(r => { const c = r.type === 'credit'; return `<div class="flex items-center gap-3 p-3.5"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${c ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}"><i class="fa-solid ${c ? 'fa-arrow-down' : 'fa-arrow-up'} text-sm"></i></span>
        <div class="min-w-0 flex-1"><p class="truncate text-sm font-semibold">${esc(r.reason)}</p><p class="text-xs text-slate-400">${esc(fmt(r.ts))}</p></div><p class="shrink-0 text-sm font-bold ${c ? 'text-emerald-600' : 'text-red-600'}">${c ? '+' : '-'} ${esc(money(r.amount))}</p></div>`; }).join('')}</div>
      ${rows.length > shown.length ? '<button data-act="more" class="mt-4 w-full rounded-xl border border-slate-200 bg-white py-3 text-sm font-semibold text-slate-600">Load more</button>' : ''}`}`;
  },

  withdraw() {
    const m = METHODS[S.method], min = cfg(m.min), max = cfg(m.max), gift = S.method !== 'upi';
    const recent = Object.entries(S.wd).map(([id, w]) => ({ ...w, id })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 10);
    return `${backBtn('#/wallet', 'Redeem')}<div class="mb-4 ${CARD} p-4"><p class="text-xs text-slate-500">Available Balance</p><p class="mt-1 text-xl font-bold">${esc(money(S.profile.balance))}</p></div>
      <div class="mb-4 grid grid-cols-3 gap-2">${Object.entries(METHODS).map(([k, v]) => `<button data-act="method" data-v="${k}" class="${S.method === k ? 'btn-primary text-white' : 'glass-chip text-slate-600'} flex flex-col items-center gap-1.5 rounded-2xl py-3 text-xs font-semibold"><i class="${v.icon} text-xl"></i>${v.label}</button>`).join('')}</div>
      <form data-form="withdraw" class="space-y-4 ${CARD} p-4">
      ${gift ? `<p class="rounded-xl bg-indigo-50 p-3 text-xs text-indigo-700"><i class="fa-solid fa-circle-info mr-1.5"></i>Your ${esc(m.label)} redeem code will appear under Recent Requests after the admin sends it.</p>`
        : `<div><label class="mb-1.5 block text-xs font-semibold text-slate-600"><i class="fa-solid fa-building-columns mr-1"></i>UPI ID</label><input name="upi" required maxlength="100" placeholder="name@bank" class="${INP}"></div>`}
      <div><label class="mb-1.5 block text-xs font-semibold text-slate-600"><i class="fa-solid fa-coins mr-1"></i>Amount</label><input name="amount" inputmode="decimal" required placeholder="Enter amount" class="${INP}">
        <p class="mt-1.5 text-xs text-slate-500">Minimum ${esc(money(min))} &middot; Maximum ${esc(money(max))}</p>${gift ? '' : `<p id="feeInfo" class="mt-1 rounded-lg bg-amber-50 px-2.5 py-1.5 text-xs font-semibold text-amber-700"><i class="fa-solid fa-circle-info mr-1"></i>${esc(String(cfg('upi_fee_pct')))}% UPI fee is deducted from the amount.</p>`}</div>
      ${gift ? `<div class="flex flex-wrap gap-2">${[10, 50, 100, 500, 1000].map(n => `<button type="button" data-act="preset" data-v="${n}" class="glass-chip rounded-full px-3.5 py-1.5 text-xs font-semibold text-slate-600">${esc(cfg('currency_symbol'))}${n}</button>`).join('')}</div>` : ''}
      <button type="submit" class="${BTN}"><i class="${m.icon}"></i>Redeem ${esc(m.label)}</button></form>
      <h2 class="mb-3 mt-6 text-base font-bold">Recent Requests</h2>
      ${!recent.length ? emptyBox('fa-gift', 'No redeem requests.') : `<div class="divide-y divide-slate-100 ${CARD}">${recent.map(w => { const mm = METHODS[w.method || 'upi'] || METHODS.upi; return `<div class="flex items-center justify-between gap-3 p-3.5"><div class="min-w-0"><p class="text-sm font-bold">${esc(money(w.amount))} <span class="font-medium text-slate-500">&middot; ${esc(mm.label)}</span></p>
        ${w.upi ? `<p class="truncate text-xs text-slate-500">${esc(w.upi)}</p>` : ''}${w.fee ? `<p class="text-xs text-slate-500">Fee ${esc(money(w.fee))} &middot; You get <b>${esc(money(w.net))}</b></p>` : ''}${w.code ? `<p class="selectable mt-1 break-all rounded-lg bg-emerald-50 px-2 py-1 text-xs font-bold text-emerald-700">Code: ${esc(w.code)}</p>` : ''}${w.status === 'rejected' && w.reason ? `<p class="mt-1 text-xs font-semibold text-red-600">Reason: ${esc(w.reason)}</p>` : ''}<p class="text-xs text-slate-400">${esc(fmt(w.createdAt))}</p></div>${badge(w.status)}</div>`; }).join('')}</div>`}`;
  },

  leaderboard() {
    const mask = n => { const p = String(n || 'User').trim().split(/\s+/); return p[0] + (p[1] ? ' ' + p[1][0].toUpperCase() + '.' : ''); };
    const rows = Object.entries(S.lb).map(([id, v]) => ({ id, ...v })).filter(r => r.name).map(r => ({ ...r, earned: r.earned || 0 })).sort((a, b) => b.earned - a.earned).slice(0, 50);
    const me = rows.findIndex(r => r.id === S.user.uid);
    const medal = i => i === 0 ? 'bg-amber-100 text-amber-600' : i === 1 ? 'bg-slate-200 text-slate-600' : i === 2 ? 'bg-orange-100 text-orange-600' : 'bg-indigo-50 text-indigo-600';
    return `<h1 class="text-xl font-bold">Leaderboard</h1><p class="mb-5 text-sm text-slate-500">Top earners of all time</p>
      <div class="hero mb-5 rounded-3xl p-5 text-white"><p class="relative text-xs font-medium text-indigo-100"><i class="fa-solid fa-trophy mr-1.5"></i>Your Rank</p>
      <p class="relative mt-1 text-3xl font-bold">${me >= 0 ? '#' + (me + 1) : 'Not ranked yet'}</p><p class="relative mt-1 text-xs text-indigo-100">${me >= 0 ? 'Total earned ' + esc(money(rows[me].earned)) : 'Complete tasks to enter the leaderboard.'}</p></div>
      ${S.errs.lb ? emptyBox('fa-lock', 'Leaderboard is locked', 'Publish the latest Firebase rules (leaderboard permission denied).') : !rows.length ? emptyBox('fa-ranking-star', 'No rankings yet.', 'Be the first to earn!') : `<div class="divide-y divide-slate-100 ${CARD}">${rows.map((r, i) => `<div class="flex items-center gap-3 p-3.5 ${r.id === S.user.uid ? 'bg-indigo-50/60' : ''}">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-bold ${medal(i)}">${i < 3 ? `<i class="fa-solid ${i === 0 ? 'fa-crown' : 'fa-medal'}"></i>` : i + 1}</span>
        <div class="min-w-0 flex-1"><p class="truncate text-sm font-semibold">${r.id === S.user.uid ? 'You' : esc(mask(r.name))}</p><p class="text-xs text-slate-400">Rank #${i + 1}</p></div><p class="shrink-0 text-sm font-bold text-indigo-600">${esc(money(r.earned))}</p></div>`).join('')}</div>`}`;
  },

  promote() {
    const list = Object.entries(S.promos).map(([id, p]) => ({ ...p, id })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const price = cfg('promo_price');
    const L = (label, inner) => `<div><label class="mb-1.5 block text-xs font-semibold text-slate-600">${label}</label>${inner}</div>`;
    return `${backBtn('#/home', 'Promote Your App')}
      <div class="mb-4 ${CARD} p-4"><p class="text-sm text-slate-600">Get real users to install, rate or join your app or channel. You pay <b>${esc(money(price))}</b> per completed task from your wallet. Users earn ${esc(money(cfg('promo_reward')))} per task. After admin approval your task goes live.</p>
      <p class="mt-2 text-xs text-slate-500">Wallet balance: <b>${esc(money(S.profile.balance))}</b></p></div>
      <form data-form="promote" class="space-y-4 ${CARD} p-4">
      ${L('App or Channel Name', `<input name="pname" maxlength="60" required placeholder="e.g. My Game App" class="${INP}">`)}
      ${L('Link (Play Store / channel link)', `<input name="purl" type="url" required placeholder="https://" class="${INP}">`)}
      ${L('What should users do?', `<select name="ptype" class="${INP}"><option value="install">Install the app</option><option value="review">Rate and review</option><option value="channel">Join the channel</option><option value="watch">Watch a video</option></select>`)}
      ${L('Number of users (10 - 1000)', `<input name="pqty" inputmode="numeric" required value="10" class="${INP}">`)}
      ${L('Instructions (optional)', `<textarea name="pnote" rows="2" maxlength="200" class="${INP}" placeholder="Anything users must do?"></textarea>`)}
      <p id="promoCost" class="text-sm font-semibold text-indigo-600">Total cost: ${esc(money(10 * price))}</p>
      <button type="submit" class="${BTN}"><i class="fa-solid fa-rocket"></i>Submit Promotion</button></form>
      <h2 class="mb-3 mt-6 text-base font-bold">Your Promotions</h2>
      ${!list.length ? emptyBox('fa-rocket', 'No promotions yet.') : `<div class="divide-y divide-slate-100 ${CARD}">${list.map(p => `<div class="flex items-center justify-between gap-3 p-3.5"><div class="min-w-0"><p class="truncate text-sm font-bold">${esc(p.name)}</p>
        <p class="text-xs text-slate-500">${esc((TYPES[p.type] || TYPES.watch)[0])} &middot; ${p.qty} users &middot; ${esc(money(p.cost))}</p>${p.status === 'approved' ? `<p class="text-xs font-semibold text-emerald-600">${Math.min(S.stats[p.taskId] || 0, p.qty)}/${p.qty} completed</p>` : ''}${p.status === 'rejected' && p.reason ? `<p class="text-xs font-semibold text-red-600">Reason: ${esc(p.reason)}</p>` : ''}</div>${badge(p.status)}</div>`).join('')}</div>`}`;
  },

  refer() {
    const code = S.profile.referralCode || '', link = cfg('referral_link'), msg = 'Join ' + cfg('site_name') + ' and earn real rewards by completing tasks! Download: ' + link + '  Use my referral code: ' + code;
    const list = Object.values(S.refs).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const need = cfg('referral_tasks'), earned = list.reduce((s, r) => s + (r.rewarded ? (r.amount || 0) : 0), 0);
    return `<h1 class="text-xl font-bold">Refer & Earn</h1><p class="mb-5 text-sm text-slate-500">Earn ${esc(money(cfg('referral_reward')))} when a friend you invite completes ${cfg('referral_tasks')} tasks.</p>
      <div class="mb-4 rounded-3xl hero p-5 text-center text-white"><p class="text-xs font-medium text-indigo-100">Your Referral Code</p><p class="selectable mt-2 text-3xl font-extrabold tracking-widest">${esc(code)}</p>
      <button data-act="copy" data-v="${esc(code)}" class="mt-4 inline-flex items-center gap-2 rounded-xl bg-white px-5 py-2.5 text-sm font-semibold text-indigo-600"><i class="fa-solid fa-copy"></i>Copy Code</button></div>
      <div class="mb-5 ${CARD} p-4"><p class="mb-2 text-xs font-semibold text-slate-600"><i class="fa-solid fa-link mr-1"></i>Referral Link</p><input readonly value="${esc(link)}" class="selectable w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-xs text-slate-600 outline-none">
      <div class="mt-3 grid grid-cols-2 gap-3"><button data-act="copy" data-v="${esc(link)}" class="rounded-xl bg-indigo-50 py-2.5 text-sm font-semibold text-indigo-700"><i class="fa-solid fa-copy mr-1"></i>Copy Link</button><a href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener noreferrer" class="btn-primary rounded-xl py-2.5 text-center text-sm font-semibold text-white"><i class="fa-brands fa-whatsapp mr-1"></i>Share</a></div></div>
      <div class="mb-5 grid grid-cols-2 gap-3"><div class="${CARD} p-4"><p class="text-xs text-slate-500">Total Referrals</p><p class="mt-1 text-xl font-bold">${list.length}</p></div><div class="${CARD} p-4"><p class="text-xs text-slate-500">Total Earned</p><p class="mt-1 text-xl font-bold">${esc(money(earned))}</p></div></div>
      <h2 class="mb-3 text-base font-bold">Your Referrals</h2>
      ${!list.length ? emptyBox('fa-user-group', 'No referrals yet.', 'Share your code to start earning.') : `<div class="divide-y divide-slate-100 ${CARD}">${list.map(r => `<div class="flex items-center justify-between gap-3 p-3.5"><div class="min-w-0"><p class="truncate text-sm font-semibold">${esc(r.name)}</p><p class="text-xs text-slate-400">Joined ${esc(fmt(r.createdAt))}</p></div>
      ${r.rewarded ? `<span class="shrink-0 text-sm font-bold text-emerald-600">+ ${esc(money(r.amount))}</span>` : `<span class="shrink-0 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700"><i class="fa-solid fa-clock mr-1"></i>${Math.min(r.done || 0, need)}/${need} tasks</span>`}</div>`).join('')}</div>`}`;
  },

  profile() {
    const p = S.profile;
    return `<div class="mb-5 flex items-center gap-4 ${CARD} p-5"><span class="flex h-16 w-16 items-center justify-center rounded-full bg-indigo-50 text-2xl text-indigo-600"><i class="fa-solid fa-user"></i></span>
      <div class="min-w-0"><p class="truncate text-lg font-bold">${esc(p.name)}</p><p class="text-sm text-slate-500"><i class="fa-solid fa-mobile-screen-button mr-1"></i>${esc(p.mobile)}</p></div></div>
      <div class="mb-5 ${CARD} p-4"><p class="text-xs text-slate-500">Referral Code</p><p class="selectable mt-1 text-lg font-bold tracking-widest text-indigo-600">${esc(p.referralCode)}</p></div>
      <form data-form="name" class="mb-5 space-y-3 ${CARD} p-4"><label class="block text-sm font-bold">Edit Name</label><input name="name" value="${esc(p.name)}" maxlength="60" required class="${INP}"><button type="submit" class="${BTN}">Save Changes</button></form>
      ${musicRow()}
      ${legalMenu()}
      <button data-act="logout" class="flex w-full items-center justify-center gap-2 rounded-xl bg-red-50 py-3.5 text-sm font-semibold text-red-600"><i class="fa-solid fa-right-from-bracket"></i>Logout</button>`;
  }
};

// ================= shell + routing =================
function buildShell() {
  const items = [['#/home', 'fa-house', 'Home'], ['#/partners', 'fa-fire', 'Hot Offer'], ['#/wallet', 'fa-wallet', 'Wallet'], ['#/extra', 'fa-gem', 'Extra'], ['#/addmoney', 'fa-circle-plus', 'Add Coins'], ['#/leaderboard', 'fa-trophy', 'Leaderboard'], ['#/refer', 'fa-users', 'Refer & Earn'], ['#/promote', 'fa-rocket', 'Promote Your App'], ['#/profile', 'fa-user', 'Profile']];
  const tabs = [['home', '#/home', 'fa-house', 'Home'], ['rank', '#/leaderboard', 'fa-trophy', 'Rank'], ['extra', '#/extra', 'fa-gem', 'Extra'], ['refer', '#/refer', 'fa-users', 'Refer'], ['profile', '#/profile', 'fa-user', 'Profile']];
  $('#shell').innerHTML = `
  <header class="glass-bar app-header sticky top-0 z-30 flex items-center justify-between px-4">
    <a href="#/home" class="flex items-center gap-2.5"><img src="${LOGO}" alt="" class="h-9 w-9 rounded-xl"><span class="js-site text-base font-bold tracking-tight"></span></a>
    <button type="button" id="menuBtn" aria-label="Open menu" class="flex h-10 w-10 items-center justify-center rounded-xl text-slate-600 active:bg-slate-100"><i class="fa-solid fa-bars text-lg"></i></button></header>
  <div id="drawer" class="pointer-events-none fixed inset-y-0 left-1/2 z-50 w-full max-w-md -translate-x-1/2 overflow-hidden">
    <div id="overlay" class="absolute inset-0 bg-slate-900/30 opacity-0 backdrop-blur-sm transition-opacity duration-300"></div>
    <aside id="sidebar" class="absolute left-0 top-0 flex h-full w-72 -translate-x-full flex-col glass-strong rounded-r-3xl transition-transform duration-300">
      <div class="side-top flex items-center justify-between border-b border-slate-100 p-4"><div class="flex items-center gap-3"><span class="flex h-11 w-11 items-center justify-center rounded-full bg-indigo-50 text-indigo-600"><i class="fa-solid fa-user"></i></span>
        <div class="min-w-0"><p id="sbName" class="truncate text-sm font-semibold"></p><p id="sbMobile" class="text-xs text-slate-500"></p></div></div>
        <button type="button" id="closeBtn" aria-label="Close menu" class="flex h-9 w-9 items-center justify-center rounded-xl text-slate-500 active:bg-slate-100"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <nav class="flex-1 space-y-1 p-3">${items.map(i => `<a href="${i[0]}" class="side-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 active:bg-slate-50"><i class="fa-solid ${i[1]} w-5 text-center"></i>${i[2]}</a>`).join('')}</nav>
      <div class="border-t border-slate-100 p-3"><button data-act="logout" class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-red-600 active:bg-red-50"><i class="fa-solid fa-right-from-bracket w-5 text-center"></i>Logout</button></div></aside></div>
  <main id="view" class="px-4 pb-4 pt-5"></main>
  <div id="slotBox" class="px-4 pb-28"></div>
  <div id="adSticky" class="bottom-nav hidden fixed left-1/2 z-20 w-[calc(100%-24px)] max-w-[420px] -translate-x-1/2" style="margin-bottom:76px"></div>
  <nav class="glass-strong bottom-nav fixed left-1/2 z-30 grid w-[calc(100%-24px)] max-w-[420px] -translate-x-1/2 grid-cols-5 rounded-[28px] px-2 pb-2 pt-2">
    ${tabs.map(t => t[0] === 'extra'
      ? `<a href="${t[1]}" data-tab="${t[0]}" class="tab nav-center flex flex-col items-center gap-1 text-[11px] font-bold text-slate-400"><span class="pill nav-orb"><i class="fa-solid ${t[2]}"></i></span>${t[3]}</a>`
      : `<a href="${t[1]}" data-tab="${t[0]}" class="tab flex flex-col items-center gap-1 text-[11px] font-semibold text-slate-400"><span class="pill flex h-8 w-14 items-center justify-center rounded-full"><i class="fa-solid ${t[2]} text-base"></i></span>${t[3]}</a>`).join('')}</nav>`;
  const d = $('#drawer'), o = $('#overlay'), s = $('#sidebar');
  const open = () => { d.classList.remove('pointer-events-none'); o.classList.remove('opacity-0'); s.classList.remove('-translate-x-full'); };

// ---- Refer & Earn with link + code + special share message
function refMsg() {
  const code = S.profile.referralCode || '', link = cfg('referral_link'); let m = String(cfg('referral_message') || '');
  if (!m.includes('{link}')) m += ' ' + link; if (!m.includes('{code}')) m += ' Referral code: ' + code;
  return m.split('{code}').join(code).split('{link}').join(link);
}
function shareTo(k) {
  const link = cfg('referral_link'), msg = refMsg();
  if (k === 'wa') return openExt('https://wa.me/?text=' + ENC(msg));
  if (k === 'tg') return openExt('https://t.me/share/url?url=' + ENC(link) + '&text=' + ENC(msg.split(link).join('').trim()));
  if (k === 'ig') { copyTxt(msg).then(() => flash('success', 'Message copied. Paste it in Instagram chat or story.')); return openExt('https://www.instagram.com/direct/inbox/'); }
  if (navigator.share) navigator.share({ title: cfg('site_name'), text: msg }).catch(() => {}); else copyTxt(msg).then(() => flash('success', 'Message copied.'));
}

      <div class="mt-3 grid grid-cols-2 gap-3"><button data-act="copy" data-v="${esc(link)}" class="rounded-xl bg-indigo-50 py-2.5 text-sm font-semibold text-indigo-700"><i class="fa-solid fa-copy mr-1"></i>Copy Link</button><button data-act="copy" data-v="${esc(refMsg())}" class="btn-primary rip rounded-xl py-2.5 text-sm font-semibold text-white"><i class="fa-solid fa-message mr-1"></i>Copy Message</button></div></div>

function fillPh(str, tok) {   // replaces the placeholders partners use for the user id / name

function revealScratch() { if (!S.xs || S.xs.revealed) return; S.xs.revealed = true; S._tutLock = null; render(true); flash('success', 'You won ' + money(S.xs.prize) + '!'); }
function initScratch(cv) {
  cv._init = true; const ctx = cv.getContext('2d'), g = ctx.createLinearGradient(0, 0, 288, 176);
  g.addColorStop(0, '#cbd5e1'); g.addColorStop(.5, '#f1f5f9'); g.addColorStop(1, '#94a3b8'); ctx.fillStyle = g; ctx.fillRect(0, 0, 288, 176);
  ctx.fillStyle = '#64748b'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('SCRATCH HERE', 144, 94);
  let down = false;
  const scratch = e => { if (!down) return; const r = cv.getBoundingClientRect(); ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc((e.clientX - r.left) * 288 / r.width, (e.clientY - r.top) * 176 / r.height, 16, 0, 7); ctx.fill(); };
  const up = () => { down = false; try { const d = ctx.getImageData(0, 0, 288, 176).data; let clear = 0, tot = 0; for (let i = 3; i < d.length; i += 160) { tot++; if (d[i] === 0) clear++; } if (clear / tot > 0.45) revealScratch(); } catch (_) {} };
  cv.addEventListener('pointerdown', e => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} scratch(e); });
  cv.addEventListener('pointermove', scratch); cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}

    if (c.max > 0 && (c.used || 0) >= c.max) return flash('error', 'This code has reached its limit.');

// ---- "How to Complete" shows the conditions written by the admin in the task description
function descSteps(d) {
  // one condition per line (numbering and bullets are removed)
  let lines = String(d || '').split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*\u2022>]+\s*|\d{1,2}[.):]\s+)/, '').trim()).filter(Boolean);
  // a single paragraph: one condition per sentence. A dot is a sentence end only when a space follows it, so "5.50" stays intact
  if (lines.length === 1) { const sentences = lines[0].split(/(?<=[.!?\u0964])\s+/).map(x => x.trim()).filter(x => x.length > 1); if (sentences.length > 1) lines = sentences; }
  return lines.slice(0, 15);
}


// ---- background music: admin sets it, the user can switch it off in Profile
const BGM = new Audio(); BGM.loop = true; BGM.preload = 'none'; window.__bgm = BGM;
const musicOn = () => lsGet('te_music') !== 'off' && !!(S.bgm && S.bgm.enabled);
function bgmApply() {
  const cfgM = S.bgm || {};
  if (!musicOn()) { BGM.pause(); return; }
  if (!cfgM.url && !S.bgmFile) {
    if (cfgM.enabled && !S._bgmReq) { S._bgmReq = true; get(ref(db, 'bgmusicFile')).then(x => { S.bgmFile = x.val() || null; bgmApply(); }).catch(() => { S._bgmReq = false; }); }
    return;
  }
  const src = cfgM.url || S.bgmFile;
  if (BGM.getAttribute('data-src') !== src) { BGM.src = src; BGM.setAttribute('data-src', src); }
  BGM.volume = Math.max(0, Math.min(1, (cfgM.volume == null ? 30 : cfgM.volume) / 100));
  if (BGM.paused) BGM.play().catch(() => {});      // browsers allow sound only after a tap, so the next tap starts it
}
document.addEventListener('pointerdown', () => { if (musicOn() && BGM.paused) bgmApply(); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) BGM.pause(); else if (musicOn()) bgmApply(); });
function musicRow() {
  if (!(S.bgm && S.bgm.enabled)) return '';
  const on = musicOn();
  return `<button data-act="music" class="mb-5 flex w-full items-center justify-between ${CARD} p-4 text-left"><span class="flex items-center gap-3"><span class="flex h-9 w-9 items-center justify-center rounded-xl ${on ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-500'}"><i class="fa-solid ${on ? 'fa-music' : 'fa-volume-xmark'}"></i></span><span class="text-sm font-semibold">Background music</span></span><span class="rounded-full px-3 py-1 text-xs font-bold ${on ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">${on ? 'On' : 'Off'}</span></button>`;
}

// ---- click / submit hooks used by the main handlers
function extClick(b, a) {
  if (a === 'music') { lsSet('te_music', musicOn() ? 'off' : 'on'); bgmApply(); render(true); return true; }
  if (a === 'xopen') { const k = b.dataset.k; if (!xLive(k)) flash('error', XF[k].title + ' is coming soon.'); else location.hash = '#/extra/' + k; return true; }
  if (a === 'xspin') { doSpin(); return true; }
  if (a === 'xscratch') { doScratch(); return true; }
  if (a === 'xreveal') { revealScratch(); return true; }
  if (a === 'xvstart') { xvStart(); return true; }
  if (a === 'xvcancel') { xvCancel(); return true; }
  if (a === 'tutplay') { const box = $('#tutVid'); if (box) { box.innerHTML = `<iframe src="https://www.youtube.com/embed/${esc(b.dataset.id)}?autoplay=1&rel=0&modestbranding=1&playsinline=1" class="h-full w-full border-0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`; S._tutLock = routeKey(); } return true; }
  if (a === 'loadvoice') { busy(async () => { const id = b.dataset.id, x = await get(ref(db, 'tutorialAudio/' + id)); if (!x.exists()) return flash('error', 'Voice guide not found.'); S._aud[id] = x.val(); render(true); setTimeout(() => { const au = document.querySelector('#view audio'); if (au) au.play().catch(() => {}); }, 80); }); return true; }
  if (a === 'partner') { openPartner(b.dataset.id); return true; }
  if (a === 'consent') { lsSet('te_watch_ok', '1'); S.consentDenied = false; render(true); return true; }
  if (a === 'denyconsent') { S.consentDenied = true; render(true); return true; }
  if (a === 'share') { shareTo(b.dataset.v); return true; }
  if (a === 'rewarded') { openRewarded(); return true; }
  if (a === 'payreset') { S.pay = null; render(true); return true; }
  return false;
}
function extSubmit(f, k) {
  if (k === 'xcode') { doCode(f); return true; }
  if (k === 'payamt') { const amt = parseMoney(f.amount.value), min = cfg('add_min'), max = cfg('add_max'); if (!amt || amt < min) flash('error', 'Minimum amount is ' + money(min) + '.'); else if (amt > max) flash('error', 'Maximum amount is ' + money(max) + '.'); else { S.pay = { amt }; render(true); } return true; }
  if (k === 'utr') { busy(() => doDeposit(f)); return true; }
  return false;
}

// ================= events =================
document.addEventListener('contextmenu', e => e.preventDefault());
$('#auth').addEventListener('click', e => { if (e.target.closest('[data-act="mode"]')) { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; S.authErr = ''; renderAuth(true); } });
$('#auth').addEventListener('submit', e => { e.preventDefault(); const f = e.target; busy(() => f.dataset.form === 'signup' ? doSignup(f) : doLogin(f)); });
$('#shell').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (extClick(b, a)) return;
  if (a === 'cat') { S.cat = b.dataset.v; render(true); }
  else if (a === 'more') { S.txShown += 20; render(true); }
  else if (a === 'method') { S.method = b.dataset.v; render(true); }
  else if (a === 'preset') { const i = document.querySelector('#view input[name=amount]'); if (i) i.value = b.dataset.v; }
  else if (a === 'complete') busy(() => completeTask(b.dataset.id, null));
  else if (a === 'logout') signOut(auth);
  else if (a === 'copy') { const t = b.dataset.v, old = b.innerHTML, done = () => { b.innerHTML = '<i class="fa-solid fa-check mr-1"></i>Copied'; setTimeout(() => b.innerHTML = old, 1500); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done); else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); done(); } }
});
$('#shell').addEventListener('input', e => { if (e.target.name === 'amount' && S.method === 'upi' && $('#feeInfo')) { const a = parseMoney(e.target.value) || 0, pct = cfg('upi_fee_pct') || 0, fee = Math.round(a * pct / 100); $('#feeInfo').innerHTML = '<i class="fa-solid fa-circle-info mr-1"></i>' + (a ? 'Fee ' + money(fee) + ' (' + pct + '%) &middot; You get ' + money(a - fee) : pct + '% UPI fee is deducted from the amount.'); } if (e.target.name === 'pqty') { const q = parseInt(e.target.value, 10) || 0; $('#promoCost').textContent = 'Total cost: ' + money(q * cfg('promo_price')); } });
$('#shell').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, k = f.dataset.form;
  if (extSubmit(f, k)) return;
  if (k === 'proof') busy(() => completeTask(f.dataset.id, f.proof.files[0]));
  else if (k === 'withdraw') busy(() => doWithdraw(f.upi ? f.upi.value.trim() : '', f.amount.value));
  else if (k === 'promote') busy(() => doPromote(f));
  else if (k === 'name') busy(async () => { const n = f.name.value.trim(); if (n.length < 2 || n.length > 60) return flash('error', 'Please enter a valid name (2-60 characters).'); try { await set(ref(db, `users/${S.user.uid}/name`), n); flash('success', 'Profile updated.'); } catch (_) { flash('error', 'Could not update profile.'); } });
});

// ================= data + boot =================
function listen(path, key, q) { unsubs.push(onValue(q || ref(db, path), s => { S[key] = s.val() || {}; S._loaded[key] = true; delete S.errs[key]; if (key === 'tx' || key === 'lb') maybeSyncLb(); if (key === 'ads') { updateAds(); S._slotSig = null; updateSlot(route()[0]); }
    if (key === 'bgm') bgmApply(); render(); }, e => { S.errs[key] = e.message; S._loaded[key] = true; console.error(path, e.message); render(); })); }
async function boot(u) {
  S.user = u;
  const snap = await get(ref(db, 'users/' + u.uid));
  if (!snap.exists()) { S.authErr = 'Account profile not found. Please create an account.'; await signOut(auth); return; }
  if (snap.val().status === 'blocked') { S.authErr = 'Your account has been blocked. Please contact support.'; await signOut(auth); return; }
  S.profile = snap.val(); const uid = u.uid;
  listen('tasks', 'tasks'); listen('taskStats', 'stats'); listen('userTasks/' + uid, 'ut'); listen('withdrawals/' + uid, 'wd'); listen('referrals/' + uid, 'refs');
  listen('', 'tx', query(ref(db, 'transactions/' + uid), limitToLast(300)));
  listen('promos/' + uid, 'promos'); listen('', 'lb', query(ref(db, 'leaderboard'), orderByChild('earned'), limitToLast(50)));
  listen('deposits/' + uid, 'dep'); listen('ads', 'ads'); listen('partners', 'partners'); listen('extras', 'extras'); listen('bgmusic', 'bgm');
  unsubs.push(onValue(ref(db, `extraUse/${uid}/${todayStr()}`), x => { S.xu = x.val() || {}; render(); }, () => {}));
  unsubs.push(onValue(ref(db, `adViews/${uid}/${todayStr()}`), x => { S.advToday = x.val() || 0; render(); }, () => {}));
  unsubs.push(onValue(ref(db, 'users/' + uid), s => { const v = s.val(); if (!v) return; if (v.status === 'blocked') { S.authErr = 'Your account has been blocked. Please contact support.'; signOut(auth); return; } S.profile = v; render(); }));
  buildShell(); hideBoot(); $('#auth').classList.add('hidden'); $('#shell').classList.remove('hidden'); render(true);
}
onValue(ref(db, 'settings'), s => { S.settings = s.val() || {}; document.title = cfg('site_name'); document.querySelectorAll('.js-site').forEach(e => e.textContent = cfg('site_name')); if (!S.user) renderAuth(); else render(); });
const qref = new URLSearchParams(location.search).get('ref');
if (qref) { S.authMode = 'signup'; S.refPrefill = qref.toUpperCase().replace(/[^A-Z0-9]/g, ''); }
onAuthStateChanged(auth, async u => {
  authResolved = true;
  if (S.signingUp) return;
  if (u) { await boot(u); }
  else { teardown(); hideBoot(); $('#shell').classList.add('hidden'); $('#auth').classList.remove('hidden'); renderAuth(true); }
});
</script>
</body>
